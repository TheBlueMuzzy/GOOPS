  :root { --bg: #05070d; --panel: #0b1224f0; --line: #1e293b; --ink: #e2e8f0; --dim: #64748b; --accent: #22d3ee;

  .bar { position: fixed; left: 0; right: 0; margin: 0 auto; max-width: 560px; box-sizing: border-box;

  #bottom { bottom: 0; padding-bottom: max(14px, env(safe-area-inset-bottom)); }

    background: #0b1224d9; color: var(--ink); font: 600 14px system-ui, sans-serif; touch-action: manipulation; cursor: pointer; }
  button:active { background: var(--line); }
  button.on { border-color: var(--accent); color: #a5f3fc; }
  #bottom button { min-height: 48px; font-size: 15px; }
  #bottom .lbl { flex: 0 0 auto; font-size: 12px; color: var(--dim); }
  #fps { flex: 0 0 56px; font: 700 13px ui-monospace, monospace; color: #4ade80; }
  #hint { position: fixed; left: 16px; right: 16px; text-align: center; font-size: 12.5px; line-height: 1.35; color: var(--dim); z-index: 2; pointer-events: none; }
  #hint b { color: #cbd5e1; font-weight: 600; }
  #hint .bad { color: #fca5a5; } #hint .ok { color: #86efac; }
  body.side #hint { right: 316px; }
  /* Knobs: beside the view on a wide screen (Muzzy tunes on the PC), a bottom sheet on a phone. Never over the view. */
  #panel { position: fixed; z-index: 3; display: none; box-sizing: border-box; background: var(--panel); overflow-y: auto; }
  #panel.open { display: block; }
  body.side #panel { top: 0; bottom: 0; right: 0; width: 300px; border-left: 1px solid var(--line); padding: max(16px, env(safe-area-inset-top)) 16px 16px; }
  body.side .bar { right: 300px; }
  body.sheet #panel { left: 0; right: 0; bottom: 0; max-height: 40vh; border-top: 1px solid var(--line); border-radius: 14px 14px 0 0;
    padding: 12px 16px max(12px, env(safe-area-inset-bottom)); }
  body.sheet #bottom { bottom: var(--sheet, 0px); padding-bottom: 8px; }
  #panel h4 { margin: 10px 0 2px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); }
  #panel label { display: flex; align-items: center; gap: 10px; font-size: 13px; margin: 6px 0; }
  #panel label span { flex: 0 0 84px; }
  #panel input[type=range] { flex: 1; min-width: 0; accent-color: var(--accent); }
  #panel select { flex: 1; min-width: 0; height: 30px; padding: 0 4px; font: 600 12px system-ui, sans-serif; color: var(--ink);
    background: #0b1224; border: 1px solid var(--line); border-radius: 6px; }
  /* the value box: type any number, even past the slider's ends (the slider then sits at its end, the box turns amber) */
  #panel input.num { flex: 0 0 52px; width: 52px; box-sizing: border-box; padding: 3px 4px; text-align: right; font: 600 12px ui-monospace, monospace;
    color: #94a3b8; background: #0b1224; border: 1px solid var(--line); border-radius: 6px; -moz-appearance: textfield; }
  #panel input.num::-webkit-inner-spin-button, #panel input.num::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  #panel input.num:focus { outline: none; border-color: var(--accent); color: var(--ink); }
  #panel input.num.over { color: #fbbf24; border-color: #fbbf2480; }
  #panel .help { margin: -4px 0 8px; font-size: 11px; line-height: 1.35; color: var(--dim); }
  #presets { display: flex; flex-wrap: wrap; gap: 6px; margin: 2px 0 10px; }
  #presets button, #bCopy { flex: 0 0 auto; min-height: 32px; padding: 0 12px; font-size: 13px; border-radius: 10px; }
  #presets .pw { display: inline-flex; }
  #presets .pw button { border-radius: 10px 0 0 10px; }
  #presets .pw i { display: flex; align-items: center; padding: 0 8px; border: 1px solid var(--line); border-left: 0;
    border-radius: 0 10px 10px 0; color: var(--dim); font-style: normal; cursor: pointer; }
  #presets .pw i:hover { color: #fca5a5; }
  #presets .add { border-style: dashed; color: #94a3b8; }
  #bCopy { display: block; margin-top: 10px; width: 100%; }

  /* ===== The preview screen: the real HUD drawn at its real pixel size, then scaled to fit ===== */
  #frameLbl { position: fixed; z-index: 1; font: 600 11px system-ui, sans-serif; color: var(--dim); text-align: center; pointer-events: none; }
  #frame { position: fixed; z-index: 1; left: 0; top: 0; transform-origin: 0 0; overflow: hidden; background: #04060b;
    outline: 1px solid #1e293b; font-family: var(--px); color: var(--hudInk); }
  #frame * { box-sizing: border-box; }
  .abs { position: absolute; }
  /* the tank: the dark green glass with its faint grid, curved like the game's */
  .tank { border-radius: 18px / 26px; background: radial-gradient(120% 70% at 50% 35%, #12302b 0%, #0b1d1c 55%, #050c0d 100%);
    box-shadow: inset 0 0 40px #000, 0 0 0 2px #000; overflow: hidden; }
  .tank .grid { position: absolute; inset: 0; opacity: .5;
    background-image: linear-gradient(#1f3f3b55 1px, transparent 1px), linear-gradient(90deg, #1f3f3b55 1px, transparent 1px); }
  .goop { position: absolute; border-radius: 22%; box-shadow: inset 0 -5px 10px #0006, inset 4px 5px 8px #fff4; }
  .goop::after { content: ''; position: absolute; left: 16%; top: 12%; width: 30%; height: 16%; border-radius: 50%; background: #fff7; filter: blur(1px); }
  .crack { position: absolute; pointer-events: none; }
  /* cut-corner shapes (pause, score, charge buttons, panel): the outer layer is the border colour, the inner one the fill */
  .cut { position: absolute; clip-path: polygon(var(--k) 0, calc(100% - var(--k)) 0, 100% var(--k), 100% calc(100% - var(--k)), calc(100% - var(--k)) 100%, var(--k) 100%, 0 calc(100% - var(--k)), 0 var(--k)); }
  .shape { inset: 0; background: var(--bd, var(--cyan)); }
  .shape > .in { position: absolute; inset: 2px; background: var(--fill, #071722); }
  .glowy { filter: drop-shadow(0 0 4px #22d3ee88); }
  .hudtxt { position: absolute; white-space: nowrap; text-shadow: 0 0 6px #22d3ee66, 0 2px 0 #000; line-height: 1; }
  .dock .lbl { position: absolute; text-align: center; white-space: nowrap; line-height: 1; text-shadow: 0 2px 0 #000; }
  .meter { position: absolute; background: #22e1ff; clip-path: polygon(7px 0, calc(100% - 7px) 0, 100% 50%, calc(100% - 7px) 100%, 7px 100%, 0 50%);
    box-shadow: 0 0 8px #22d3ee; }
  .meter .lbl { position: absolute; inset: 0; display: grid; place-items: center; color: #0b3440; text-shadow: none; }
  .bad-outline { outline: 2px dashed #f87171; outline-offset: 2px; }
  /* the charge buttons */
  .ab { position: absolute; cursor: pointer; touch-action: manipulation; }
  .ab .shape { --bd: #475569; --fill: #0b1220; transition: background .15s; }
  .ab svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
  .ab .trk { stroke: #1e293b; fill: none; }
  .ab .arc { stroke: var(--cyan); opacity: .55; fill: none; stroke-linecap: round; }
  .ab .ico { color: #64748b; }
  .ab .num { position: absolute; left: 0; right: 0; text-align: center; color: #94a3b8; line-height: 1; pointer-events: none; }
  .ab.ready { filter: drop-shadow(0 0 calc(var(--g) * 14px) rgba(34, 211, 238, calc(var(--g) * 1))); animation: abPulse 1.2s ease-in-out infinite; }
  .ab.ready .shape { --bd: var(--cyanBright); --fill: #0c3442; }
  .ab.ready .arc { stroke: var(--cyanBright); opacity: 1; }
  .ab.ready .ico { color: #a5f3fc; }
  .ab.ready .num { color: #cffafe; }
  @keyframes abPulse { 50% { filter: drop-shadow(0 0 calc(var(--g) * 6px) rgba(34, 211, 238, calc(var(--g) * .7))); } }
  .ab.fired .shape { --fill: #e0fbff; }
  .ab .flash { position: absolute; inset: -10%; border-radius: 50%; border: 3px solid #e0fbff; opacity: 0; pointer-events: none; }
  .ab.fired .flash { animation: abFlash .45s ease-out; }
  @keyframes abFlash { 0% { opacity: 1; transform: scale(.7); } 100% { opacity: 0; transform: scale(1.9); } }
  .ab.refused { animation: abNo .3s; }
  @keyframes abNo { 25% { transform: translateX(-3px); } 75% { transform: translateX(3px); } }
  .thumb { position: absolute; border-radius: 50%; border: 2px dashed #4ade8088; background: radial-gradient(closest-side, #4ade8018, #4ade8008); pointer-events: none; }
  .thumbLbl { position: absolute; font: 600 12px system-ui, sans-serif; color: #86efac; pointer-events: none; text-shadow: 0 1px 2px #000; }
  .fxname { position: absolute; font-size: 14px; color: #cffafe; pointer-events: none; white-space: nowrap; text-shadow: 0 0 6px #22d3ee, 0 2px 0 #000; animation: fxUp .9s ease-out forwards; }
  @keyframes fxUp { from { opacity: 1; transform: translate(-50%, 0); } to { opacity: 0; transform: translate(-50%, -28px); } }
</style>

  colPos: 'B only: slide the column from the top of the tank (0) to the bottom (1). Lower = easier for a thumb, but that\'s where the goop piles up.',
  count: 'How many actives are equipped: 1 (today), 2 (Expansion Slot, rank 20) or 3 (Slot 2, rank 38). Watch what gets squeezed at 3.',
  size: 'Each button\'s width and height in real pixels. 44 = the pause button and the smallest comfortable tap. Under 44 the fit report turns red.',
  gap: 'Space between buttons. Too small and a thumb hits the neighbour.',
  ring: 'How thick the charge ring is. Thin reads as "detail", thick reads from across the room.',
  number: 'On = the charge % under the icon. At small sizes it crowds the icon (today\'s button hides it for that reason).',
  glow: 'How strongly a full (ready) button glows and pulses. 0 = it only turns bright.',
  screen: 'Which screen to preview, at its real size. Also the 360 / 390 / 1440 buttons on top.',
  loadout: 'Which three actives are equipped, so you can see all four icons: bolt = Cooldown Booster, drops = Goop Dump, paint drop = Goop Colorizer, crack + arrow = Crack Down.',
};

// ===== The sketch itself =====
// The real HUD's sizes, measured from the game's screenshots (e2e-shots/twists/r40-compare-*). Real pixels.
const FRAMES = [
  { w: 360, h: 780, phone: true, tank: { x: 8, y: 40, w: 344, h: 590 }, dock: { x: 0, y: 652, w: 360, h: 128 }, row: { x: 16, w: 328, cy: 34 } },
  { w: 390, h: 844, phone: true, tank: { x: 8, y: 40, w: 374, h: 650 }, dock: { x: 0, y: 715, w: 390, h: 129 }, row: { x: 16, w: 358, cy: 35 } },
  { w: 1440, h: 900, phone: false, tank: { x: 510, y: 20, w: 420, h: 740 }, dock: { x: 495, y: 772, w: 450, h: 128 }, row: { x: 510, w: 420, cy: 38 } }];
const PAUSE = 44, ROW_GAP = 8, EDGE = 8;  // pause button size, gap between top-row items, B's breathing room from the tank edge
const CRACK_BIG = 27, CRACK_MIN = 16;     // the crack count's size, and the body-text floor it may shrink to (kit HudText fit)
const SCORE_FONT = 24, BAR_FONT = 18, BAR_FONT_MIN = 12; // (sizes matched to the game's screenshots)
// The widest real numbers (App.tsx F34 note, e2e-shots/upgrades/widest-count): a 5-digit score beside "CRACKS 56 / 57"
const SCORE_TXT = '99999', CRACK_TXT = 'CRACKS 56 / 57', CRACK_SHORT = '56 / 57';
const MACHINES = ['VISOR', 'LASER', 'CONTROLS'];
// The actives: icon (24-unit SVG path, drawn in the button's colour) and a sped-up demo charge time (real: 15-30 s)
const ACTIVES = {
  booster:   { name: 'Cooldown Booster', secs: 7, icon: '<path d="M13.5 2 4 13.5h6.5L9 22l10-12.5h-6.5L13.5 2z" fill="currentColor"/>' },
  dump:      { name: 'Goop Dump', secs: 5, icon: '<path d="M6 2.5c-1.6 2.6-3 4.4-3 6a3 3 0 0 0 6 0c0-1.6-1.4-3.4-3-6zM17.5 1.5c-1.6 2.6-3 4.4-3 6a3 3 0 0 0 6 0c0-1.6-1.4-3.4-3-6zM12 11c-2 3.2-3.7 5.4-3.7 7.4a3.7 3.7 0 0 0 7.4 0c0-2-1.7-4.2-3.7-7.4z" fill="currentColor"/>' },
  colorizer: { name: 'Goop Colorizer', secs: 9, icon: '<path d="M10 2.5C7.4 6.7 5 9.6 5 12.6a5 5 0 0 0 10 0c0-3-2.4-5.9-5-10.1z" fill="currentColor"/><rect x="15.5" y="14" width="6" height="6" rx="1.2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M7.6 12.4a2.6 2.6 0 0 0 2.4 2.7" stroke="#0b1220" stroke-width="1.6" fill="none" stroke-linecap="round"/>' },
  crackdown: { name: 'Crack Down', secs: 11, icon: '<path d="M9 1.5 6.5 6l3 2.5-3 4 2 2" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><path d="M17 3v13m-4.5-4.5L17 16l4.5-4.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><path d="M3 21h18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>' } };
const LOADOUTS = [['booster', 'dump', 'colorizer'], ['booster', 'dump', 'crackdown'], ['dump', 'colorizer', 'crackdown']];
// Goop sitting in the tank (column 0-5, row counted up from the bottom, colour): piles at both edges, so B's cover shows
const GOOP_COLORS = ['#ef4444', '#3b82f6', '#22c55e', '#eab308', '#a855f7', '#e2e8f0'];
const GOOP = [[0, 0, 0], [1, 0, 1], [2, 0, 2], [4, 0, 3], [5, 0, 4], [0, 1, 4], [1, 1, 1], [4, 1, 2], [5, 1, 0], [0, 2, 2], [5, 2, 3], [0, 3, 5],
  [5, 3, 1], [5, 4, 2], [0, 4, 0], [3, 0, 5], [3, 1, 3]];
const CRACKS = [[5, 5, '#a855f7'], [0, 5, '#ef4444'], [2, 1, '#3b82f6']];  // cracks waiting to be sealed (col, row from bottom)

// ---- the measuring tape: text widths in the game's pixel font
const meas = document.createElement('canvas').getContext('2d');
const textW = (s, px) => { meas.font = `${px}px 'Nokia Cellphone FC'`; return meas.measureText(s).width; };

// ---- plan(): where everything goes on one screen, plus an honest fit report. Pure numbers, so Copy values can
// report every screen size at once.
function plan(fi, V) {
  const F = FRAMES[fi], n = Math.round(V.count), S = V.size, g = V.gap, L = Math.round(V.layout);
  const P = { F, buttons: [], notes: [], bad: [] };
  const tank = { ...F.tank }, dock = { ...F.dock };
  // C+: the panel grows by however much its own row of buttons needs (the tank gets that much shorter)
  const dockInner = () => dock.h - 24;
  const barsH = 38 + 10 + 24;      // machine row (name + bar) + gap + integrity bar
  if (L === 3) {
    const need = S + 10 + barsH, grow = Math.max(0, need - dockInner());
    dock.y -= grow; dock.h += grow; tank.h -= grow;
    if (grow) P.notes.push(`panel ${grow}px taller, tank ${grow}px shorter (${Math.round(grow / F.tank.h * 100)}% of its height)`);
    else P.notes.push('the panel fits the row as it is');
  }
  P.tank = tank; P.dock = dock;
  // the top row: score · crack count · (A: the buttons) · pause
  const row = F.row, cy = row.cy;
  const scoreW = Math.ceil(textW(SCORE_TXT, SCORE_FONT)) + 20;
  P.score = { x: row.x, y: cy - 20, w: scoreW, h: 40 };
  P.pause = { x: row.x + row.w - PAUSE, y: cy - PAUSE / 2, w: PAUSE, h: PAUSE };
  let right = P.pause.x - ROW_GAP;
  if (L === 0) {
    for (let i = n - 1; i >= 0; i--) { P.buttons[i] = { x: right - S, y: cy - S / 2, w: S, h: S }; right -= S + (i ? g : ROW_GAP); }
  }
  const room = right - (P.score.x + scoreW + ROW_GAP);
  // the crack count shrinks to fit, then drops its name, like the game (kit HudText fit + App.tsx shortCount)
  let txt = CRACK_TXT, px = CRACK_BIG;
  while (px > CRACK_MIN && textW(txt, px) > room) px--;
  if (textW(txt, px) > room) { txt = CRACK_SHORT; px = CRACK_BIG; while (px > CRACK_MIN && textW(txt, px) > room) px--; }
  const tw = textW(txt, px), fits = tw <= room;
  P.cracks = { txt, px, x: P.score.x + scoreW + ROW_GAP + Math.max(0, (room - tw) / 2), cy, fits, room };
  if (!fits) P.bad.push(`crack count doesn't fit even as "${CRACK_SHORT}" at ${CRACK_MIN}px (needs ${Math.ceil(tw)}px, has ${Math.floor(room)}px)`);
  else if (txt !== CRACK_TXT) P.notes.push(`crack count drops its word: "${txt}" at ${px}px`);
  else if (px < CRACK_BIG) P.notes.push(`crack count shrinks to ${px}px`);
  else P.notes.push('crack count keeps its full size');
  // B: a column hugging the tank's edge (phones: over the tank; desktop: in the empty space beside it)
  if (L === 1) {
    const colH = n * S + (n - 1) * g, right = V.side >= 1;
    const x = F.phone ? (right ? tank.x + tank.w - EDGE - S : tank.x + EDGE) : (right ? tank.x + tank.w + 16 : tank.x - 16 - S);
    const top0 = tank.y + 60, top1 = tank.y + tank.h - EDGE - colH;
    const y = top0 + (top1 - top0) * Math.min(1, Math.max(0, V.colPos));
    for (let i = 0; i < n; i++) P.buttons[i] = { x, y: y + i * (S + g), w: S, h: S };
  }
  // the panel: next-piece window at the left; the machine bars over the integrity bar to its right (C / C+: the buttons too)
  const pad = 10, nextW = 66;
  P.next = { x: dock.x + pad, y: dock.y + pad, w: nextW, h: dock.h - 2 * pad };
  const ax = P.next.x + nextW + 9, aw = dock.x + dock.w - pad - ax;
  let rowY, rowH = 38, barsAreaW = aw;
  if (L === 2) {
    rowH = Math.max(38, S);
    barsAreaW = aw - n * S - n * g;
    const top = dock.y + (dock.h - (rowH + 10 + 24)) / 2;
    rowY = top;
    for (let i = 0; i < n; i++) P.buttons[i] = { x: ax + barsAreaW + g + i * (S + g), y: rowY + (rowH - S) / 2, w: S, h: S };
    if (rowH + 10 + 24 > dockInner()) P.bad.push('the buttons are taller than the panel');
  } else if (L === 3) {
    const total = S + 10 + barsH, top = dock.y + (dock.h - total) / 2;
    const bw = n * S + (n - 1) * g, bx = ax + (aw - bw) / 2;
    for (let i = 0; i < n; i++) P.buttons[i] = { x: bx + i * (S + g), y: top, w: S, h: S };
    rowY = top + S + 10;
    if (bw > aw) P.bad.push(`the button row is wider than the panel (${bw}px, room ${aw}px)`);
  } else rowY = dock.y + (dock.h - barsH) / 2;
  // machine bars, like the game (hud.json machineWidth, kit Bar atMost): each never narrower than its name, the spare
  // room shared out, each at most 31% of the room; centred. Too little room: the names shrink (red below 12px).
  const mGap = 8, gaps = (MACHINES.length - 1) * mGap;
  const widths = px => { const lw = MACHINES.map(m => textW(m, px) + 4), spare = barsAreaW - gaps - lw.reduce((a, b) => a + b, 0);
    return { lw, spare, w: lw.map(l => Math.max(l, Math.min(barsAreaW * 0.31, l + Math.max(0, spare) / MACHINES.length))) }; };
  let lpx = BAR_FONT; while (lpx > BAR_FONT_MIN && widths(lpx).spare < 0) lpx--;
  const WB = widths(lpx), lFits = WB.spare >= 0, total = WB.w.reduce((a, b) => a + b, 0) + gaps;
  let bx = ax + Math.max(0, (barsAreaW - total) / 2);
  P.bars = MACHINES.map((m, i) => { const r = { name: m, x: bx, y: rowY + (rowH - 38), w: WB.w[i], px: lpx }; bx += WB.w[i] + mGap; return r; });
  P.integrity = { x: ax, y: rowY + rowH + 10, w: aw, h: 24 };
  if (!lFits) P.bad.push(`machine bars squeezed into ${Math.floor(barsAreaW)}px: their names overlap even at ${BAR_FONT_MIN}px`);
  else if (lpx < BAR_FONT) P.notes.push(`machine names shrink to ${lpx}px`);
  // how much tank the buttons cover (B on a phone), in cells (the tank is 6 cells wide)
  const cell = tank.w / 6;
  let cover = 0;
  for (const b of P.buttons) {
    const ox = Math.max(0, Math.min(b.x + b.w, tank.x + tank.w) - Math.max(b.x, tank.x)), oy = Math.max(0, Math.min(b.y + b.h, tank.y + tank.h) - Math.max(b.y, tank.y));
    if (L !== 0) cover += ox * oy; // (A's buttons sit in the top row over the tank's empty top, like the pause button)
  }
  P.coverCells = cover / (cell * cell);
  if (P.coverCells > 0.05) P.bad.push(`buttons cover ${P.coverCells.toFixed(1)} tank cells (the ${V.side >= 1 ? 'right' : 'left'} edge column)`);
  else if (L === 1) P.notes.push('tank stays clear');
  if (S < 44) P.bad.push(`${S}px buttons: under the 44px comfortable tap`);
  // the % number at this size
  if (V.number >= 1 && S < 40) P.notes.push('the % number is tiny at this size');
  return P;
}

// ---- drawing the preview screen (DOM at real pixels, scaled to fit)
const frame = $('frame');
const box = (r, cls, html = '', style = '') => `<div class="${cls}" style="left:${r.x}px;top:${r.y}px;width:${r.w}px;height:${r.h}px;${style}">${html}</div>`;
const shape = (k, bd, fill) => `<div class="cut shape" style="--k:${k}px;${bd ? '--bd:' + bd + ';' : ''}${fill ? '--fill:' + fill : ''}"><div class="cut in" style="--k:${k - 1}px"></div></div>`;
let P = null, abEls = [], pieceEl = null, thumbOn = true;
// charge per equipped slot (0..1); kept across redraws
const charge = [0.92, 0.45, 0.1];
function render() {
  P = plan(Math.round(UI.screen), UI);
  const F = P.F, T = P.tank, cell = T.w / 6;
  let h = '';
  // the tank, its goop and cracks
  let goop = '';
  for (const [c, r, k] of GOOP) {
    const gx = c * cell + cell * 0.08, gy = T.h - (r + 1) * cell + cell * 0.08;
    goop += `<div class="goop" style="left:${gx}px;top:${gy}px;width:${cell * 0.84}px;height:${cell * 0.84}px;background:${GOOP_COLORS[k]}"></div>`;
  }
  for (const [c, r, col] of CRACKS) {
    const gx = c * cell, gy = T.h - (r + 1) * cell;
    goop += `<svg class="crack" style="left:${gx}px;top:${gy}px;width:${cell}px;height:${cell}px" viewBox="0 0 10 10"><path d="M2 2.2 4 4.4 3.3 5.6 6 7.1 5.6 8.2 8 8.6" fill="none" stroke="${col}" stroke-width=".8" stroke-linejoin="round" style="filter:drop-shadow(0 0 1.5px ${col})"/></svg>`;
  }
  goop += `<div id="piece" style="position:absolute;left:0;top:0;width:${cell * 2}px;height:${cell * 2}px">`
    + [[0, 0], [1, 0], [2, 0], [1, 1]].map(([x, y]) => `<div class="goop" style="left:${x * cell + cell * 0.08}px;top:${y * cell + cell * 0.08}px;width:${cell * 0.84}px;height:${cell * 0.84}px;background:#a855f7;opacity:.95"></div>`).join('') + '</div>';
  h += box(T, 'abs tank', `<div class="grid" style="background-size:${cell}px ${cell}px"></div>${goop}`);
  // the top row
  h += box(P.score, 'abs glowy', shape(9) + `<div class="hudtxt" style="left:0;right:0;top:${(40 - SCORE_FONT) / 2}px;text-align:center;font-size:${SCORE_FONT}px">${SCORE_TXT}</div>`);
  const C = P.cracks;
  h += `<div class="hudtxt${C.fits ? '' : ' bad-outline'}" style="left:${C.x}px;top:${C.cy - C.px / 2}px;font-size:${C.px}px">${C.txt}</div>`;
  h += `<div class="hudtxt" style="left:${C.x + textW(C.txt, C.px) * 0.45}px;top:${C.cy + C.px / 2 + 6}px;font-size:16px">100% PSI</div>`;
  h += box(P.pause, 'abs glowy', shape(11) + '<svg viewBox="0 0 24 24" style="position:absolute;inset:25%;width:50%;height:50%"><rect x="5" y="4" width="5" height="16" fill="#e2f8ff"/><rect x="14" y="4" width="5" height="16" fill="#e2f8ff"/></svg>');
  // the panel
  const D = P.dock;
  h += box(D, 'abs dock glowy', shape(16, '#22d3eeaa', '#06111b'));
  h += box(P.next, 'abs', shape(10, '#22d3ee88', '#040b12')
    + [[1, 0], [1, 1], [2, 1], [0, 2]].map(([x, y]) => `<div style="position:absolute;left:${P.next.w / 2 - 22 + x * 15}px;top:${P.next.h / 2 - 22 + y * 15}px;width:12px;height:12px;background:#ef4444;border-radius:2px;box-shadow:inset 0 -2px 0 #0004"></div>`).join(''));
  for (const b of P.bars) {
    h += `<div class="abs dock"><div class="lbl" style="left:${b.x}px;width:${b.w}px;top:${b.y}px;font-size:${b.px}px">${b.name}</div></div>`;
    h += `<div class="meter" style="left:${b.x}px;top:${b.y + 24}px;width:${b.w}px;height:14px"></div>`;
  }
  const I = P.integrity;
  h += `<div class="meter" style="left:${I.x}px;top:${I.y}px;width:${I.w}px;height:${I.h}px"><div class="lbl" style="font-size:16px">INTEGRITY</div></div>`;
  // thumb reach (phones): the easy zone for a right thumb holding the phone one-handed
  if (thumbOn && F.phone) {
    const tw = F.w * 1.25, th = F.h * 0.62;
    h += `<div class="thumb" style="left:${F.w - tw * 0.62}px;top:${F.h - th * 0.62}px;width:${tw}px;height:${th}px"></div>`;
    h += `<div class="thumbLbl" style="left:${F.w * 0.36}px;top:${F.h - th * 0.62 + 10}px">easy thumb reach (right hand)</div>`;
  }
  // the charge buttons
  const n = Math.round(UI.count), ids = LOADOUTS[Math.round(UI.loadout)] || LOADOUTS[0];
  for (let i = 0; i < n; i++) {
    const b = P.buttons[i], S = b.w, A = ACTIVES[ids[i]], t = UI.ring * 100 / S, r = 50 - 9 - t / 2, circ = 2 * Math.PI * r;
    const num = UI.number >= 1, ico = num ? 0.36 : 0.46, icoY = num ? 0.42 : 0.5;
    h += `<div class="ab" data-i="${i}" style="left:${b.x}px;top:${b.y}px;width:${S}px;height:${S}px;--g:${UI.glow}" title="${A.name}">`
      + shape(Math.round(S * 0.24))
      + `<svg viewBox="0 0 100 100"><circle class="trk" cx="50" cy="50" r="${r}" stroke-width="${t}"/><circle class="arc" cx="50" cy="50" r="${r}" stroke-width="${t}" stroke-dasharray="${circ}" transform="rotate(-90 50 50)"/></svg>`
      + `<svg class="ico" viewBox="0 0 24 24" style="inset:auto;left:${(1 - ico) / 2 * 100}%;top:${(icoY - ico / 2) * 100}%;width:${ico * 100}%;height:${ico * 100}%">${A.icon}</svg>`
      + (num ? `<div class="num" style="top:${S * 0.6}px;font-size:${Math.max(7, Math.round(S * 0.2))}px">0</div>` : '')
      + '<div class="flash"></div></div>';
  }
  frame.style.width = F.w + 'px'; frame.style.height = F.h + 'px';
  frame.innerHTML = h;
  pieceEl = $('piece');
  abEls = [...frame.querySelectorAll('.ab')].map(el => ({ el, arc: el.querySelector('.arc'), num: el.querySelector('.num'), circ: +el.querySelector('.arc').getAttribute('stroke-dasharray'), ready: null }));
  report(); fitFrame();
}
// the fit report above the screen
function report() {
  const L = Math.round(UI.layout), sizes = FRAMES.map((_, i) => plan(i, UI));
  const line = (p, i) => `<b>${['360', '390', '1440'][i]}:</b> ` + (p.bad.length ? `<span class="bad">${p.bad.join('; ')}</span>` : `<span class="ok">fits</span>`) + (p.notes.length ? ' · ' + p.notes.join('; ') : '');
  $('hint').innerHTML = `<b>${LAYOUT_NAMES[L]}</b>${L === 3 ? ' (Claude\'s pick)' : ''} · tap a bright button (or 1 / 2 / 3) to fire<br>`
    + line(sizes[Math.round(UI.screen)], Math.round(UI.screen));
  $('frameLbl').textContent = SCREEN_NAMES[Math.round(UI.screen)] + ' — real size, scaled to fit';
}
// scale the screen to the room between the bars
let scale = 1;
function fitFrame() {
  if (!P) return;
  $('hint').style.top = $('top').getBoundingClientRect().bottom + 2 + 'px';
  const F = P.F, top = $('hint').getBoundingClientRect().bottom + 22, bot = $('bottom').getBoundingClientRect().top - 8, w = playW() - 32;
  scale = Math.min(w / F.w, (bot - top) / F.h, 1);
  const left = (playW() - F.w * scale) / 2;
  frame.style.transform = `translate(${left}px, ${top}px) scale(${scale})`;
  const lb = $('frameLbl'); lb.style.left = '16px'; lb.style.width = playW() - 32 + 'px'; lb.style.top = (top - 17) + 'px';
}
// firing: a ready button flashes and empties; a charging one shakes ("not yet")
function fire(i) {
  const a = abEls[i]; if (!a) return;
  a.el.classList.remove('fired', 'refused'); void a.el.offsetWidth;
  if (charge[i] >= 1) {
    charge[i] = 0; a.el.classList.add('fired');
    const ids = LOADOUTS[Math.round(UI.loadout)] || LOADOUTS[0], b = P.buttons[i];
    const t = document.createElement('div'); t.className = 'fxname'; t.textContent = ACTIVES[ids[i]].name.toUpperCase() + '!';
    t.style.left = Math.min(P.F.w - 90, Math.max(90, b.x + b.w / 2)) + 'px'; t.style.top = (b.y > P.F.h / 2 ? b.y - 26 : b.y + b.h + 8) + 'px';
    frame.appendChild(t); setTimeout(() => t.remove(), 950);
  } else a.el.classList.add('refused');
}
frame.addEventListener('pointerdown', e => { const el = e.target.closest('.ab'); if (el) fire(+el.dataset.i); });
addEventListener('keydown', e => { if (e.target.tagName === 'INPUT') return; const k = '123'.indexOf(e.key); if (k >= 0) fire(k); });
function update(dt) {
  const ids = LOADOUTS[Math.round(UI.loadout)] || LOADOUTS[0];
  for (let i = 0; i < 3; i++) charge[i] = Math.min(1, charge[i] + dt / ACTIVES[ids[i]].secs);
  pieceT = (pieceT + dt * 0.9) % 7;
}
let pieceT = 0;
function draw() {
  for (let i = 0; i < abEls.length; i++) {
    const a = abEls[i], c = charge[i], ready = c >= 1;
    a.arc.style.strokeDashoffset = a.circ * (1 - c);
    if (a.num) a.num.textContent = Math.floor(c * 100);
    if (a.ready !== ready) { a.el.classList.toggle('ready', ready); a.ready = ready; }
  }
  if (pieceEl && P) { const cell = P.tank.w / 6; pieceEl.style.transform = `translate(${cell * 2}px, ${(pieceT - 1.2) * cell}px)`; }
}
const LOOK_BTNS = () => document.querySelectorAll('#looks button');
function showLook() {
  for (const b of LOOK_BTNS()) b.classList.toggle('on', +b.dataset.l === Math.round(UI.layout));
  for (const b of document.querySelectorAll('#screens button')) b.classList.toggle('on', +b.dataset.s === Math.round(UI.screen));
  render();
}
$('looks').onclick = e => { if (e.target.dataset.l !== undefined) { UI.layout = +e.target.dataset.l; showKnob('layout'); } };
$('screens').onclick = e => { if (e.target.dataset.s !== undefined) { UI.screen = +e.target.dataset.s; showKnob('screen'); } };
$('bThumb').onclick = () => { thumbOn = !thumbOn; $('bThumb').classList.toggle('on', thumbOn); render(); };
$('bThumb').classList.toggle('on', thumbOn);
function layout() { dockKnobs(); fitFrame(); }

// ===== Sketch kit (keep as is): docked knobs, presets, copy values, help lines, fps =====
const SIDE = 300;
function dockKnobs() {
  const p = $('panel'), open = p.classList.contains('open'), wide = innerWidth >= 700;
  document.body.classList.toggle('side', open && wide);
  document.body.classList.toggle('sheet', open && !wide);
  document.body.style.setProperty('--sheet', open && !wide ? p.offsetHeight + 'px' : '0px');
}
function playW() { return document.body.classList.contains('side') ? innerWidth - SIDE : innerWidth; }
const isChoice = row => row[1] === 'choice';
$('panel').innerHTML = '<div id="presets"></div>' + KNOBS.map(row => { const [k, lo, hi, st] = row; return lo === undefined ? `<h4>${k}</h4>` :
  (isChoice(row) ? `<label><span>${KNOB_LABEL[k] || k}</span><select id="k_${k}">${hi.map((n, i) => `<option value="${i}">${n}</option>`).join('')}</select></label>`
  : `<label><span>${KNOB_LABEL[k] || k}</span><input type="range" id="k_${k}" min="${lo}" max="${hi}" step="${st}" value="${UI[k]}"><input class="num" type="number" inputmode="decimal" id="v_${k}" step="${st}" value="${UI[k]}" title="Type any value, even past the slider's ends"></label>`)
  + (KNOB_HELP[k] ? `<div class="help">${KNOB_HELP[k]}</div>` : ''); }).join('')
  + '<button id="bCopy">Copy values for Claude</button>';
for (const row of KNOBS) if (isChoice(row)) $('k_' + row[0]).value = UI[row[0]]; // the drop-downs start on the current values
// show a value in both the slider (pinned at its end when past it) and the box (amber when past the slider's ends)
function showKnob(k) {
  const row = KNOBS.find(r => r[0] === k), v = UI[k];
  if (isChoice(row)) { $('k_' + k).value = v; showLook(); return; }
  const box = $('v_' + k);
  $('k_' + k).value = v; if (document.activeElement !== box) box.value = v;
  box.classList.toggle('over', v < row[1] || v > row[2]);
  render();
}
// typing in the box updates the sketch live; Enter or leaving the box applies, Escape puts back what was there
for (const row of KNOBS) {
  const [k, lo] = row; if (lo === undefined) continue;
  if (isChoice(row)) { $('k_' + k).onchange = e => { UI[k] = +e.target.value; showKnob(k); }; continue; }
  const box = $('v_' + k); let before = UI[k];
  $('k_' + k).oninput = e => { UI[k] = +e.target.value; showKnob(k); };
  box.onfocus = () => { before = UI[k]; };
  box.oninput = () => { const v = parseFloat(box.value); if (Number.isFinite(v)) { UI[k] = v; showKnob(k); } };
  box.onkeydown = e => {
    if (e.key === 'Enter') box.blur();
    if (e.key === 'Escape') { UI[k] = before; box.value = before; showKnob(k); box.blur(); }
  };
  box.onblur = () => { box.value = UI[k]; showKnob(k); };
}
$('bKnobs').onclick = () => {
  $('panel').classList.toggle('open'); $('bKnobs').classList.toggle('on'); layout();
  try { localStorage.setItem('sketch-knobs-open', $('panel').classList.contains('open') ? '1' : '0'); } catch (e) {}
};
// Presets: + Preset saves the current knobs (up to 3); tap one to load it; × deletes. Stored in this browser only.
const PKEY = 'sketch-presets:' + location.pathname.split('/').pop();
function readKnobs() { const v = {}; for (const [k, lo] of KNOBS) if (lo !== undefined) v[k] = UI[k]; return v; }
function setKnobs(v) { for (const [k, lo] of KNOBS) if (lo !== undefined && k in v) { UI[k] = v[k]; showKnob(k); } }
const DEFAULTS = readKnobs();
// The three starting presets (until you save your own over them): one per layout family, at sensible values.
const STARTERS = [
  { name: 'A top row', values: { ...DEFAULTS, layout: 0, size: 40, gap: 6, ring: 3, number: 0, glow: 0.6 } },
  { name: 'B beside tank', values: { ...DEFAULTS, layout: 1, side: 1, colPos: 0.45, size: 50, gap: 10, ring: 4, number: 0, glow: 0.6 } },
  { name: 'C panel', values: { ...DEFAULTS, layout: 2, size: 44, gap: 6, ring: 3.5, number: 0, glow: 0.6 } }];
let presets = [], activePreset = 'd';
try { presets = JSON.parse(localStorage.getItem(PKEY)) || STARTERS; } catch (e) { presets = STARTERS; }
function savePresets() { try { localStorage.setItem(PKEY, JSON.stringify(presets)); } catch (e) {} }
function drawPresets() {
  $('presets').innerHTML = `<button data-i="d" class="${activePreset === 'd' ? 'on' : ''}">Default</button>`
    + presets.map((p, i) => `<span class="pw"><button data-i="${i}" class="${activePreset === i ? 'on' : ''}">${p.name}</button><i data-x="${i}" title="Delete">&times;</i></span>`).join('')
    + (presets.length < 3 ? '<button data-i="+" class="add">+ Preset</button>' : '');
}
$('presets').onclick = e => {
  const x = e.target.dataset.x, i = e.target.dataset.i;
  if (x !== undefined) { presets.splice(+x, 1); activePreset = null; savePresets(); }
  else if (i === 'd') { setKnobs(DEFAULTS); activePreset = 'd'; }
  else if (i === '+') {
    let n = 1; while (presets.some(p => p.name === 'Preset ' + n)) n++;
    presets.push({ name: 'Preset ' + n, values: readKnobs() }); activePreset = presets.length - 1; savePresets();
  }
  else if (i !== undefined) { setKnobs(presets[+i].values); activePreset = +i; }
  drawPresets();
};
drawPresets();
$('bCopy').onclick = () => {
  // the fit at every screen size travels with the values, so Claude sees what this pick costs everywhere
  const fit = {}; FRAMES.forEach((F, i) => { const p = plan(i, UI); fit[F.w + 'x' + F.h] = { problems: p.bad, notes: p.notes }; });
  const text = document.title + String.fromCharCode(10) + JSON.stringify({ now: readKnobs(), layoutName: LAYOUT_NAMES[Math.round(UI.layout)], fit, presets }, null, 1);
  const done = ok => { $('bCopy').textContent = ok ? 'Copied! Paste it in the chat' : 'Copy blocked: open full screen and try again';
    setTimeout(() => $('bCopy').textContent = 'Copy values for Claude', 2500); };
  (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).then(() => done(true), () => done(false));
};
try { if (innerWidth >= 700 && localStorage.getItem('sketch-knobs-open') !== '0') { $('panel').classList.add('open'); $('bKnobs').classList.add('on'); } } catch (e) {}
addEventListener('resize', layout);
dockKnobs();
// the pixel font must be loaded before the text is measured
document.fonts.load(`20px 'Nokia Cellphone FC'`).catch(() => {}).then(() => { showLook(); layout(); });
showLook(); layout();
// fixed-step loop + fps (one-second average)
let last = performance.now(), acc = 0, frames = 0, fpsT = 0, paused = false;
const STEP = 1 / 60;
function frameLoop(now) {
  const dt = Math.min((now - last) / 1000, 0.1); last = now;
  if (!paused) { acc += dt; while (acc >= STEP) { update(STEP); acc -= STEP; } }
  draw();
  frames++; fpsT += dt; if (fpsT >= 1) { $('fps').textContent = Math.round(frames / fpsT) + ' fps'; frames = 0; fpsT = 0; }
  requestAnimationFrame(frameLoop);
}
requestAnimationFrame(frameLoop);
// for Playwright checks: pause the clock, set knobs, read the plan for any screen, fire a slot
window.sketch = { UI, readKnobs, setKnobs, plan: i => plan(i, UI), fire, charge,
  pause: on => { paused = on; acc = 0; },
  advance: sec => { for (let n = Math.round(sec / STEP); n > 0; n--) update(STEP); draw(); } };
</script>
</body>
</html>
