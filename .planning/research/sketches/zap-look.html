<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<!-- /sketch (BMUZ) F67, 2026-10-24. Goo look = L4 Jelly (the game's renderer). Laser = L5 free goo. Spray = v1 droplets (PRD 328-347). -->
<title>F67: Zap look</title>
<meta name="description" content="What should zapping goop look like? Tap a goop on a small jelly board: the L5 laser (beam, white-hot swell, sucked into the laser point), v1's spray of droplets, or both. Use Slow-mo to judge the motion.">
<style>
  :root { --bg: #05070d; --panel: #0b1224f0; --line: #1e293b; --ink: #e2e8f0; --dim: #64748b; --accent: #a855f7; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: #cbd5e1;
    font-family: system-ui, -apple-system, Segoe UI, sans-serif; user-select: none; -webkit-user-select: none; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #fx { pointer-events: none; z-index: 1; }
  .bar { position: fixed; left: 0; right: 0; margin: 0 auto; max-width: 560px; box-sizing: border-box;
    display: flex; gap: 8px; align-items: center; padding: 10px 16px; z-index: 2; }
  #top { top: 0; padding-top: max(10px, env(safe-area-inset-top)); }
  #bottom { bottom: 0; padding-bottom: max(14px, env(safe-area-inset-bottom)); }
  button { flex: 1; min-height: 40px; padding: 0 6px; border-radius: 12px; border: 1px solid var(--line);
    background: #0b1224d9; color: var(--ink); font: 600 14px system-ui, sans-serif; touch-action: manipulation; cursor: pointer; }
  button:active { background: var(--line); }
  button.on { border-color: var(--accent); color: #e9d5ff; }
  #bottom button { min-height: 56px; font-size: 20px; }
  #fps { flex: 0 0 64px; font: 700 13px ui-monospace, monospace; color: #4ade80; }
  #hint { position: fixed; left: 0; right: 0; text-align: center; font-size: 13px; color: var(--dim); z-index: 2; pointer-events: none; }
  body.side #hint { right: 300px; }
  /* Knobs: beside the view on a wide screen (Muzzy tunes on the PC), a bottom sheet on a phone. Never over the view. */
  #panel { position: fixed; z-index: 3; display: none; box-sizing: border-box; background: var(--panel); overflow-y: auto; }
  #panel.open { display: block; }
  body.side #panel { top: 0; bottom: 0; right: 0; width: 300px; border-left: 1px solid var(--line); padding: max(16px, env(safe-area-inset-top)) 16px 16px; }
  body.side .bar { right: 300px; }
  body.sheet #panel { left: 0; right: 0; bottom: 0; max-height: 40vh; border-top: 1px solid var(--line); border-radius: 14px 14px 0 0;
    padding: 12px 16px max(12px, env(safe-area-inset-bottom)); }
  body.sheet #bottom { bottom: var(--sheet, 0px); padding-bottom: 8px; }
  #panel h4 { margin: 6px 0 2px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); }
  #panel label { display: flex; align-items: center; gap: 10px; font-size: 13px; margin: 6px 0; }
  #panel label span { flex: 0 0 84px; }
  #panel input[type=range] { flex: 1; min-width: 0; accent-color: var(--accent); }
  /* the value box: type any number, even past the slider's ends (the slider then sits at its end, the box turns amber) */
  #panel input.num { flex: 0 0 52px; width: 52px; box-sizing: border-box; padding: 3px 4px; text-align: right; font: 600 12px ui-monospace, monospace;
    color: #94a3b8; background: #0b1224; border: 1px solid var(--line); border-radius: 6px; -moz-appearance: textfield; }
  #panel input.num::-webkit-inner-spin-button, #panel input.num::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  #panel input.num:focus { outline: none; border-color: var(--accent); color: var(--ink); }
  #panel input.num.over { color: #fbbf24; border-color: #fbbf2480; }
  #panel .help { margin: -4px 0 8px; font-size: 11px; line-height: 1.35; color: var(--dim); }
  #presets { display: flex; flex-wrap: wrap; gap: 6px; margin: 2px 0 10px; }
  #presets button, #bCopy { flex: 0 0 auto; min-height: 32px; padding: 0 12px; font-size: 13px; border-radius: 10px; }
  #presets .pw { display: inline-flex; }
  #presets .pw button { border-radius: 10px 0 0 10px; }
  #presets .pw i { display: flex; align-items: center; padding: 0 8px; border: 1px solid var(--line); border-left: 0;
    border-radius: 0 10px 10px 0; color: var(--dim); font-style: normal; cursor: pointer; }
  #presets .pw i:hover { color: #fca5a5; }
  #presets .add { border-style: dashed; color: #94a3b8; }
  #bCopy { display: block; margin-top: 10px; width: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<canvas id="fx"></canvas>
<div class="bar" id="top">
  <div id="fps">-- fps</div>
  <button id="bSlow">Slow-mo</button><button id="bKnobs">Knobs</button>
</div>
<div id="hint">Tap a goop to zap it</div>
<div id="panel"></div>
<div class="bar" id="bottom">
  <button id="bReset">Refill</button>
</div>
<script>
'use strict';
const $ = id => document.getElementById(id);

// ===== Tweakable values (the sketch's "content/*.json"). Every knob lives here. =====
// Default = the "Both" blend. Droplet numbers are in v1's units (px on v1's 30-px cell), so v1's 30 / 60 / 3 / 180 read the same here.
const GOO = {
  beamTime: 0.3,    // s the beam shows (L5: 0.3). The goop heats for 40% of it (L5: 0.12 s flash)
  whiteHot: 0.7,    // 0 = keeps its colour, 1 = pure white (L5: 0.75)
  swell: 0.2,       // how much bigger it grows while it heats (L5: 0.24)
  suckTime: 0.6,    // s to be sucked into the laser point (L5: 0.73). 0 = vanishes at once
  droplets: 18,     // droplets per zap (v1: 30, same for any size)
  dropSpeed: 110,   // px/s on v1's 30-px cell (v1: 60)
  dropLife: 1.4,    // s before a droplet fades out (v1: 3)
  gravity: 240,     // px/s² on v1's 30-px cell (v1: 180)
  sprayAt: 1,       // 0 = the moment the beam hits (from the goop) ... 1 = when the suck-in ends (from the laser point)
};
// [name, min, max, step] rows; a one-item row is a group heading. 5–8 sliders max.
const KNOBS = [['The laser'], ['beamTime', 0, 1, 0.01], ['whiteHot', 0, 1, 0.01], ['swell', 0, 1, 0.01], ['suckTime', 0, 2, 0.01],
  ['The spray'], ['droplets', 0, 100, 1], ['dropSpeed', 0, 300, 5], ['dropLife', 0.2, 6, 0.1], ['gravity', 0, 600, 10], ['sprayAt', 0, 1, 0.05]];
// One line per knob: what it does IN THIS SKETCH, and when you'd notice it. A knob Muzzy can't see working gets fixed or cut.
const KNOB_HELP = {
  beamTime: 'Seconds the white beam shows, from above the tank down to your tap. The goop heats up during the first 40% of it. 0 = no beam, no heat-up wait.',
  whiteHot: 'How far the zapped goop turns toward white. 0 = keeps its colour, 1 = pure white-hot.',
  swell: 'How much the zapped goop puffs up while it heats (0.2 = 20% bigger). Easiest to see on a big group in Slow-mo.',
  suckTime: 'Seconds to be sucked into the laser point; the side nearest your tap goes first, so it stretches into a teardrop. 0 = it just vanishes (v1).',
  droplets: 'How many droplets spray out per zap (v1: 30, whatever the size). 0 = no spray.',
  dropSpeed: 'How fast the droplets fly out (v1: 60). High = they reach well past the goop.',
  dropLife: 'Seconds before a droplet has faded away (v1: 3). Long = the tank stays speckled.',
  gravity: 'How fast the droplets fall (v1: 180). 0 = they float off; high = they drop like rain.',
  sprayAt: 'When the spray happens: 0 = the moment the beam hits, out of the whole goop; 1 = at the end, a burst out of the laser point.',
};

// ===== The sketch itself =====
// Fixed look: the game's L4 Jelly values (content/tuning/goo-jelly.json, Muzzy's pick 2026-10-17). Not knobs here.
const JELLY = { stiffness: 700, viscosity: 6.5, wobble: 0.25, translucency: 0.5, wetness: 0.9, home: 0.3, corner: 0.32, magnetism: 1.4, maxDpr: 1.5 };
const COLORS = [[0, 0, 0], [0.94, 0.27, 0.27], [0.23, 0.51, 0.96], [0.13, 0.77, 0.37], [0.92, 0.70, 0.03], [0.66, 0.33, 0.97]]; // game goo-colors
const CSS = ['#000', '#ef4444', '#3b82f6', '#22c55e', '#eab308', '#a855f7'];
const W = 8, H = 12, V1_CELL = 30;
// the board: groups of 1, 2, 4, 5, 8 and 9 cells (R red, B blue, G green, Y yellow, P purple)
const BOARD = ['........', '........', '........', '........', '........', '........',
  '..BB..GP', '..BBRGGP', 'RRRYYGGP', 'RRRYPPPP', 'RRBYPGGB', 'BBBYPGGB'];
let seed = 7; const rand = () => { seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t ^= t + Math.imul(t ^ (t >>> 7), 61 | t); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };

// ---- rules: a plain grid. Tap a group -> it's zapped (any size, so you can compare 1 vs 9). Never reads the visuals.
const G = { grid: new Uint8Array(W * H), ver: 0, events: [] };
const idx = (x, y) => y * W + x;
function refill() { for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) G.grid[idx(x, y)] = ' RBGYP'.indexOf(BOARD[y][x]) > 0 ? ' RBGYP'.indexOf(BOARD[y][x]) : 0; G.ver++; }
function groupAt(x, y) {
  const c = G.grid[idx(x, y)], out = [], seen = new Set([idx(x, y)]), stack = [[x, y]];
  while (stack.length) {
    const [cx, cy] = stack.pop(); out.push([cx, cy]);
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const nx = cx + dx, ny = cy + dy, i = idx(nx, ny);
      if (nx >= 0 && nx < W && ny >= 0 && ny < H && !seen.has(i) && G.grid[i] === c) { seen.add(i); stack.push([nx, ny]); }
    }
  }
  return out;
}
function zap(x, y, px, py) { // (x, y) cell; (px, py) the tap point in cell units = where the laser lands
  const c = G.grid[idx(x, y)]; if (!c) return false;
  const cells = groupAt(x, y);
  for (const [cx, cy] of cells) G.grid[idx(cx, cy)] = 0;
  G.ver++; G.events.push({ type: 'zap', cells, color: c, x: px ?? x + 0.5, y: py ?? y + 0.5 }); return true;
}

// ---- jelly layer (ported from lab-L4-jelly.html, the game's renderer): one shape-matched soft body per group
let bodies = [], zapped = [], drops = [], kicks = [], nextId = 1, seenVer = -1, beam = null, simT = 0;
let cellBody = new Int32Array(W * H).fill(-1);
function traceLoops(cells) {
  const key = (x, y) => (x + 64) * 1024 + (y + 64);
  const has = new Set(cells.map(([x, y]) => key(x, y)));
  const edges = new Map(), all = [];
  const add = (x0, y0, dx, dy, cell) => { const e = { x0, y0, dx, dy, cell, used: false }, k = key(x0, y0);
    if (!edges.has(k)) edges.set(k, []); edges.get(k).push(e); all.push(e); };
  cells.forEach(([x, y], ci) => {
    if (!has.has(key(x, y - 1))) add(x, y, 1, 0, ci);
    if (!has.has(key(x + 1, y))) add(x + 1, y, 0, 1, ci);
    if (!has.has(key(x, y + 1))) add(x + 1, y + 1, -1, 0, ci);
    if (!has.has(key(x - 1, y))) add(x, y + 1, 0, -1, ci);
  });
  const loops = [];
  for (const e0 of all) {
    if (e0.used) continue;
    const loop = []; let cur = e0;
    while (cur && !cur.used) {
      cur.used = true; loop.push(cur);
      const list = edges.get(key(cur.x0 + cur.dx, cur.y0 + cur.dy)) || [];
      let best = null, bs = -9;
      for (const c of list) { if (c.used) continue; const s = cur.dx * c.dy - cur.dy * c.dx; if (s > bs) { bs = s; best = c; } }
      cur = best;
    }
    loops.push(loop);
  }
  return loops;
}
function buildPoints(loops, B) {
  for (const loop of loops) {
    const n = loop.length, start = B.n, corners = [];
    for (let k = 0; k < n; k++) { const a = loop[(k + n - 1) % n], b = loop[k]; if (a.dx !== b.dx || a.dy !== b.dy) corners.push(k); }
    const rad = k => { const a = loop[(k + n - 1) % n], b = loop[k]; return (a.dx * b.dy - a.dy * b.dx) > 0 ? JELLY.corner : JELLY.corner * 0.5; };
    for (let j = 0; j < corners.length; j++) {
      const k = corners[j], kn = corners[(j + 1) % corners.length];
      const ein = loop[(k + n - 1) % n], eo = loop[k], Vx = eo.x0, Vy = eo.y0, r = rad(k);
      for (const t of [0, 0.25, 0.5, 0.75]) {
        const ax = Vx - ein.dx * r, ay = Vy - ein.dy * r, bx = Vx + eo.dx * r, by = Vy + eo.dy * r, u = 1 - t;
        pushPt(B, u * u * ax + 2 * t * u * Vx + t * t * bx, u * u * ay + 2 * t * u * Vy + t * t * by);
      }
      const runLen = ((kn - k + n) % n) || n, r2 = rad(kn), L = runLen - r - r2, m = Math.max(1, Math.round(L / 0.3));
      for (let i = 0; i < m; i++) { const s = i * L / m; pushPt(B, Vx + eo.dx * (r + s), Vy + eo.dy * (r + s)); }
    }
    B.loops.push([start, B.n - start]);
  }
}
function pushPt(B, x, y) { B.bx.push(x); B.by.push(y); B.n++; }
function makeBody(cells, color) {
  const B = { id: nextId++, color, cells, n: 0, loops: [], bx: [], by: [], fa: 0, fcx: 0, fcy: 0, rcx: 0, rcy: 0, alpha: 1, hot: 0, sc: 1 };
  buildPoints(traceLoops(cells), B);
  B.hx = Float32Array.from(B.bx); B.hy = Float32Array.from(B.by); B.x = new Float32Array(B.n); B.y = new Float32Array(B.n);
  B.vx = new Float32Array(B.n); B.vy = new Float32Array(B.n);
  let tl = 0; cells.forEach(([x, y], i) => { if (y < cells[tl][1] || (y === cells[tl][1] && x < cells[tl][0])) tl = i; });
  const [tx, ty] = cells[tl]; let run = 1; while (run < 3 && cells.some(([x, y]) => x === tx + run && y === ty)) run++;
  const tall = cells.some(([x, y]) => x === tx && y === ty + 1);
  B.hlX = tx + 0.42 + 0.36 * (run - 1); B.hlY = ty + 0.3; B.hlW = 0.24 + 0.2 * (run - 1); B.hlH = tall ? 0.12 : 0.1;
  B.cellIdx = cells.map(([x, y]) => idx(x, y));
  return B;
}
function transfer(B, olds) { // carry the old wobble across a rebuild; brand-new bodies spring out from 70%
  let matched = 0;
  for (let i = 0; i < B.n; i++) {
    let best = null, bi = 0, bd = 0.5;
    for (const O of olds) { if (O.color !== B.color) continue;
      for (let k = 0; k < O.n; k++) { const d = Math.abs(O.hx[k] - B.hx[i]) + Math.abs(O.hy[k] - B.hy[i]); if (d < bd) { bd = d; best = O; bi = k; } } }
    if (best) { B.x[i] = B.hx[i] + best.x[bi] - best.hx[bi]; B.y[i] = B.hy[i] + best.y[bi] - best.hy[bi]; B.vx[i] = best.vx[bi]; B.vy[i] = best.vy[bi]; matched++; }
    else { B.x[i] = B.hx[i]; B.y[i] = B.hy[i]; }
  }
  if (!matched) {
    let cx = 0, cy = 0; for (let i = 0; i < B.n; i++) { cx += B.hx[i]; cy += B.hy[i]; } cx /= B.n; cy /= B.n;
    for (let i = 0; i < B.n; i++) { B.x[i] = cx + (B.hx[i] - cx) * 0.7; B.y[i] = cy + (B.hy[i] - cy) * 0.7; }
  }
}
function kick(B, kind, amt) {
  if (!B || !amt) return;
  let cx = 0, cy = 0, ymax = -1e9, ymin = 1e9; for (let i = 0; i < B.n; i++) { cx += B.x[i]; cy += B.y[i]; ymax = Math.max(ymax, B.y[i]); ymin = Math.min(ymin, B.y[i]); } cx /= B.n; cy /= B.n;
  const hgt = Math.max(1, ymax - ymin), s = amt * JELLY.wobble;
  for (let i = 0; i < B.n; i++) {
    const dx = B.x[i] - cx, dy = B.y[i] - cy;
    if (kind === 'squash') { B.vy[i] += s * (ymax - B.y[i]) / Math.sqrt(hgt); B.vx[i] += s * 0.6 * dx / Math.sqrt(hgt); }
    else if (kind === 'radial') { B.vx[i] += s * dx; B.vy[i] += s * dy; }
    else if (kind === 'twist') { B.vx[i] -= s * dy; B.vy[i] += s * dx; }
  }
}
function rebuild() {
  const olds = bodies, next = [], seen = new Uint8Array(W * H);
  cellBody = new Int32Array(W * H).fill(-1);
  for (let i = 0; i < W * H; i++) {
    if (!G.grid[i] || seen[i]) continue;
    const x = i % W, y = (i - x) / W, g = groupAt(x, y); for (const [gx, gy] of g) seen[idx(gx, gy)] = 1;
    const B = makeBody(g, G.grid[i]); transfer(B, olds);
    for (const ci of B.cellIdx) cellBody[ci] = B.id;
    next.push(B);
  }
  bodies = next;
}
function stepBody(B, h, ks, kh, c) { // Müller shape matching toward the homes + home springs + damping
  const n = B.n; let cx = 0, cy = 0, rx = 0, ry = 0;
  for (let i = 0; i < n; i++) { cx += B.x[i]; cy += B.y[i]; rx += B.hx[i]; ry += B.hy[i]; }
  cx /= n; cy /= n; rx /= n; ry /= n;
  let a00 = 0, a01 = 0, a10 = 0, a11 = 0;
  for (let i = 0; i < n; i++) { const px = B.x[i] - cx, py = B.y[i] - cy, qx = B.hx[i] - rx, qy = B.hy[i] - ry;
    a00 += px * qx; a01 += px * qy; a10 += py * qx; a11 += py * qy; }
  const ang = Math.atan2(a10 - a01, a00 + a11), cs = Math.cos(ang), sn = Math.sin(ang);
  B.fa = ang; B.fcx = cx; B.fcy = cy; B.rcx = rx; B.rcy = ry;
  for (let i = 0; i < n; i++) {
    const qx = B.hx[i] - rx, qy = B.hy[i] - ry, gx = cx + cs * qx - sn * qy, gy = cy + sn * qx + cs * qy;
    B.vx[i] += (ks * (gx - B.x[i]) + kh * (B.hx[i] - B.x[i]) - c * B.vx[i]) * h;
    B.vy[i] += (ks * (gy - B.y[i]) + kh * (B.hy[i] - B.y[i]) - c * B.vy[i]) * h;
    B.x[i] += B.vx[i] * h; B.y[i] += B.vy[i] * h;
    if (B.y[i] > H) { B.y[i] = H; if (B.vy[i] > 0) B.vy[i] *= -0.3; }
    if (B.x[i] < 0) { B.x[i] = 0; if (B.vx[i] < 0) B.vx[i] *= -0.3; } else if (B.x[i] > W) { B.x[i] = W; if (B.vx[i] > 0) B.vx[i] *= -0.3; }
  }
}

// ---- THE ZAP (what this sketch is about) ----
// timeline per zapped goop:  0 .. heat (= 40% of Beam time): white-hot + swell  ->  suck-in (Suck-in time): every outline
// point slides into the laser point, nearest first (teardrop), fading at the end  ->  gone. The spray fires once, at Spray when.
const heatTime = () => GOO.beamTime * 0.4;
function startZap(e) {
  const B = bodies.find(b => b.id === cellBody[idx(e.cells[0][0], e.cells[0][1])]);
  beam = GOO.beamTime > 0 ? { x: e.x, y: e.y, t: 0, css: CSS[e.color] } : null;
  if (B) {
    bodies = bodies.filter(b => b !== B);
    B.t = 0; B.lx = e.x; B.ly = e.y; B.sprayed = false;
    let cx = 0, cy = 0; for (let i = 0; i < B.n; i++) { cx += B.bx[i]; cy += B.by[i]; } B.c0x = cx / B.n; B.c0y = cy / B.n;
    B.dist = new Float32Array(B.n); let dmax = 1e-3;
    for (let i = 0; i < B.n; i++) { B.dist[i] = Math.hypot(B.bx[i] - e.x, B.by[i] - e.y); dmax = Math.max(dmax, B.dist[i]); }
    for (let i = 0; i < B.n; i++) B.dist[i] /= dmax;
    kick(B, 'radial', 1.5 * Math.min(1, GOO.swell * 5));
    zapped.push(B);
  }
  for (const [x, y] of e.cells) for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) { // neighbours flinch (game: -0.8)
    const nx = x + dx, ny = y + dy; if (nx >= 0 && nx < W && ny >= 0 && ny < H && G.grid[idx(nx, ny)]) kicks.push([idx(nx, ny), 'radial', -0.8]);
  }
}
function spray(B) { // v1 createDropletsForPop: random outline point, outward ±0.4 rad, speed 50–130%, upward bias, size 50–120%, life 70–130%
  B.sprayed = true; const n = Math.round(GOO.droplets); if (n <= 0) return;
  let cx = 0, cy = 0; for (let i = 0; i < B.n; i++) { cx += B.x[i]; cy += B.y[i]; } cx /= B.n; cy /= B.n;
  const k = 1 / V1_CELL; // v1 px -> cells
  for (let d = 0; d < n; d++) {
    const i = Math.floor(rand() * B.n), dx = B.x[i] - cx, dy = B.y[i] - cy;
    const ang = Math.hypot(dx, dy) > 0.15 ? Math.atan2(dy, dx) + (rand() - 0.5) * 0.8 : rand() * Math.PI * 2;
    const sp = GOO.dropSpeed * (0.5 + rand() * 0.8) * k, life = GOO.dropLife * (0.7 + rand() * 0.6);
    drops.push({ x: B.x[i], y: B.y[i], vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp - GOO.dropSpeed * (50 / 60) * k,
      r: 9 * (0.5 + rand() * 0.7) * k, life, life0: GOO.dropLife, color: B.color });
  }
}

  ox = (viewW - W * cell) / 2; oy = bot - H * cell;
  $('hint').style.top = (oy - 0.6 * cell - 22) + 'px';
  Wm = Math.ceil(canvas.width / 4) * 2; Hm = Math.ceil(canvas.height / 4) * 2;
  [TM, TA, TS, TB, TQ].forEach(freeTarget);
  TM = makeTarget(Wm, Hm, false, true); TA = makeTarget(Wm, Hm, floatOK); TS = makeTarget(Wm, Hm, floatOK);
  TB = makeTarget(Wm / 2, Hm / 2, floatOK); TQ = makeTarget(Wm / 2, Hm / 2, floatOK);
}
let slow = false, paused = false;
$('bReset').onclick = refill;
$('bSlow').onclick = () => { slow = !slow; $('bSlow').classList.toggle('on', slow); $('bSlow').textContent = slow ? 'Slow-mo 0.25×' : 'Slow-mo'; };
canvas.addEventListener('pointerdown', e => {
  const px = (e.clientX - ox) / cell, py = (e.clientY - oy) / cell, gx = Math.floor(px), gy = Math.floor(py);
  if (gx >= 0 && gx < W && gy >= 0 && gy < H) zap(gx, gy, px, py);
});
refill();

// ===== Sketch kit (keep as is): docked knobs, presets, copy values, help lines, fps =====
const SIDE = 300;
function dockKnobs() {
  const p = $('panel'), open = p.classList.contains('open'), wide = innerWidth >= 700;
  document.body.classList.toggle('side', open && wide);
  document.body.classList.toggle('sheet', open && !wide);
  document.body.style.setProperty('--sheet', open && !wide ? p.offsetHeight + 'px' : '0px');
}
function playW() { return document.body.classList.contains('side') ? innerWidth - SIDE : innerWidth; }
$('panel').innerHTML = '<div id="presets"></div>' + KNOBS.map(([k, lo, hi, st]) => lo === undefined ? `<h4>${k}</h4>` :
  `<label><span>${k}</span><input type="range" id="k_${k}" min="${lo}" max="${hi}" step="${st}" value="${GOO[k]}"><input class="num" type="number" inputmode="decimal" id="v_${k}" step="${st}" value="${GOO[k]}" title="Type any value, even past the slider's ends"></label>`
  + (KNOB_HELP[k] ? `<div class="help">${KNOB_HELP[k]}</div>` : '')).join('')
  + '<button id="bCopy">Copy values for Claude</button>';
// show a value in both the slider (pinned at its end when past it) and the box (amber when past the slider's ends)
function showKnob(k) {
  const row = KNOBS.find(r => r[0] === k), v = GOO[k], box = $('v_' + k);
  $('k_' + k).value = v; if (document.activeElement !== box) box.value = v;
  box.classList.toggle('over', v < row[1] || v > row[2]);
}
// typing in the box updates the sketch live; Enter or leaving the box applies, Escape puts back what was there
for (const [k, lo] of KNOBS) if (lo !== undefined) {
  const box = $('v_' + k); let before = GOO[k];
  $('k_' + k).oninput = e => { GOO[k] = +e.target.value; showKnob(k); };
  box.onfocus = () => { before = GOO[k]; };
  box.oninput = () => { const v = parseFloat(box.value); if (Number.isFinite(v)) { GOO[k] = v; showKnob(k); } };
  box.onkeydown = e => {
    if (e.key === 'Enter') box.blur();
    if (e.key === 'Escape') { GOO[k] = before; box.value = before; showKnob(k); box.blur(); }
  };
  box.onblur = () => { box.value = GOO[k]; showKnob(k); };
}
$('bKnobs').onclick = () => {
  $('panel').classList.toggle('open'); $('bKnobs').classList.toggle('on'); layout();
  try { localStorage.setItem('sketch-knobs-open', $('panel').classList.contains('open') ? '1' : '0'); } catch (e) {}
};
// Presets: + Preset saves the current knobs (up to 3); tap one to load it; × deletes. Stored in this browser only.
const PKEY = 'sketch-presets:' + location.pathname.split('/').pop();
function readKnobs() { const v = {}; for (const [k, lo] of KNOBS) if (lo !== undefined) v[k] = GOO[k]; return v; }
function setKnobs(v) { for (const [k, lo] of KNOBS) if (lo !== undefined && k in v) { GOO[k] = v[k]; showKnob(k); } }
const DEFAULTS = readKnobs();
// The three starting presets (until you save your own over them): the L5 laser alone, v1's spray alone, and the blend (= Default)
const STARTERS = [
  { name: 'L5 laser', values: { beamTime: 0.3, whiteHot: 0.75, swell: 0.24, suckTime: 0.73, droplets: 0, dropSpeed: 60, dropLife: 3, gravity: 180, sprayAt: 0 } },
  { name: 'v1 spray', values: { beamTime: 0, whiteHot: 0, swell: 0, suckTime: 0, droplets: 30, dropSpeed: 60, dropLife: 3, gravity: 180, sprayAt: 0 } },
  { name: 'Both', values: { ...DEFAULTS } }];
let presets = [], activePreset = 'd';
try { presets = JSON.parse(localStorage.getItem(PKEY)) || STARTERS; } catch (e) { presets = STARTERS; }
function savePresets() { try { localStorage.setItem(PKEY, JSON.stringify(presets)); } catch (e) {} }
function drawPresets() {
  $('presets').innerHTML = `<button data-i="d" class="${activePreset === 'd' ? 'on' : ''}">Default</button>`
    + presets.map((p, i) => `<span class="pw"><button data-i="${i}" class="${activePreset === i ? 'on' : ''}">${p.name}</button><i data-x="${i}" title="Delete">&times;</i></span>`).join('')
    + (presets.length < 3 ? '<button data-i="+" class="add">+ Preset</button>' : '');
}
$('presets').onclick = e => {
  const x = e.target.dataset.x, i = e.target.dataset.i;
  if (x !== undefined) { presets.splice(+x, 1); activePreset = null; savePresets(); }
  else if (i === 'd') { setKnobs(DEFAULTS); activePreset = 'd'; }
  else if (i === '+') {
    let n = 1; while (presets.some(p => p.name === 'Preset ' + n)) n++;
    presets.push({ name: 'Preset ' + n, values: readKnobs() }); activePreset = presets.length - 1; savePresets();
  }
  else if (i !== undefined) { setKnobs(presets[+i].values); activePreset = +i; }
  drawPresets();
};
drawPresets();
$('bCopy').onclick = () => {
  const text = document.title + String.fromCharCode(10) + JSON.stringify({ now: readKnobs(), presets }, null, 1);
  const done = ok => { $('bCopy').textContent = ok ? 'Copied! Paste it in the chat' : 'Copy blocked: open full screen and try again';
    setTimeout(() => $('bCopy').textContent = 'Copy values for Claude', 2500); };
  (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).then(() => done(true), () => done(false));
};
try { if (innerWidth >= 700 && localStorage.getItem('sketch-knobs-open') !== '0') { $('panel').classList.add('open'); $('bKnobs').classList.add('on'); } } catch (e) {}
addEventListener('resize', layout);
layout();
// fixed-step loop + fps (one-second average); Slow-mo runs the sim at 0.25×
let last = performance.now(), acc = 0, frames = 0, fpsT = 0;
const STEP = 1 / 120;
function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.1); last = now;
  if (!paused) { acc += dt * (slow ? 0.25 : 1); while (acc >= STEP) { update(STEP); acc -= STEP; } }
  draw();
  frames++; fpsT += dt; if (fpsT >= 1) { $('fps').textContent = Math.round(frames / fpsT) + ' fps'; frames = 0; fpsT = 0; }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
// for Playwright checks: pause the clock, step it by hand, sample pixels right after drawing
window.sketch = { GOO, readKnobs, setKnobs, zap, refill, G, groupAt,
  clearFx: () => { zapped = []; drops = []; beam = null; },
  pause: on => { paused = on; acc = 0; },
  advance: sec => { for (let n = Math.round(sec / STEP); n > 0; n--) update(STEP); draw(); },
  state: () => ({ bodies, zapped, drops, beam, simT, cell, ox, oy }),
  pixel: (x, y) => { const p = new Uint8Array(4); gl.readPixels(Math.round(x * dpr), Math.round(canvas.height - y * dpr), 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, p); return [...p.slice(0, 3)]; },
  fxPixel: (x, y) => { const fd = devicePixelRatio || 1; return [...fx.getImageData(Math.round(x * fd), Math.round(y * fd), 1, 1).data]; } };
</script>
</body>
