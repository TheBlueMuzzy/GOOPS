  :root { --bg: #05070d; --panel: #0b1224f0; --line: #1e293b; --ink: #e2e8f0; --dim: #64748b; --accent: #a855f7; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: #cbd5e1;
    font-family: system-ui, -apple-system, Segoe UI, sans-serif; user-select: none; -webkit-user-select: none; }
  .bar { position: fixed; left: 0; right: 0; margin: 0 auto; max-width: 560px; box-sizing: border-box;
    display: flex; gap: 8px; align-items: center; padding: 10px 16px; z-index: 2; }
  #top { top: 0; padding-top: max(10px, env(safe-area-inset-top)); }
  #bottom { bottom: 0; padding-bottom: max(14px, env(safe-area-inset-bottom)); }
  button { flex: 1; min-height: 40px; padding: 0 6px; border-radius: 12px; border: 1px solid var(--line);
    background: #0b1224d9; color: var(--ink); font: 600 14px system-ui, sans-serif; touch-action: manipulation; cursor: pointer; }
  button:active { background: var(--line); }
  button.on { border-color: var(--accent); color: #e9d5ff; }
  #bottom button { min-height: 48px; font-size: 15px; }
  #fps { flex: 0 0 64px; font: 700 13px ui-monospace, monospace; color: #4ade80; }
  #panel { position: fixed; z-index: 3; display: none; box-sizing: border-box; background: var(--panel); overflow-y: auto; }
  #panel.open { display: block; }
  body.side #panel { top: 0; bottom: 0; right: 0; width: 300px; border-left: 1px solid var(--line); padding: max(16px, env(safe-area-inset-top)) 16px 16px; }
  body.side .bar { right: 300px; }
  body.sheet #panel { left: 0; right: 0; bottom: 0; max-height: 40vh; border-top: 1px solid var(--line); border-radius: 14px 14px 0 0;
    padding: 12px 16px max(12px, env(safe-area-inset-bottom)); }
  body.sheet #bottom { bottom: var(--sheet, 0px); padding-bottom: 8px; }
  #panel h4 { margin: 6px 0 2px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); }
  #panel label { display: flex; align-items: center; gap: 10px; font-size: 13px; margin: 6px 0; }
  #panel label span { flex: 0 0 84px; }
  #panel input[type=range] { flex: 1; min-width: 0; accent-color: var(--accent); }
  #panel input.num { flex: 0 0 52px; width: 52px; box-sizing: border-box; padding: 3px 4px; text-align: right; font: 600 12px ui-monospace, monospace;
    color: #94a3b8; background: #0b1224; border: 1px solid var(--line); border-radius: 6px; -moz-appearance: textfield; }
  #panel input.num::-webkit-inner-spin-button, #panel input.num::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  #panel input.num:focus { outline: none; border-color: var(--accent); color: var(--ink); }
  #panel input.num.over { color: #fbbf24; border-color: #fbbf2480; }
  #panel .help { margin: -4px 0 8px; font-size: 11px; line-height: 1.35; color: var(--dim); }
  #presets { display: flex; flex-wrap: wrap; gap: 6px; margin: 2px 0 10px; }
  #presets button, #bCopy { flex: 0 0 auto; min-height: 32px; padding: 0 12px; font-size: 13px; border-radius: 10px; }
  #presets .pw { display: inline-flex; }
  #presets .pw button { border-radius: 10px 0 0 10px; }
  #presets .pw i { display: flex; align-items: center; padding: 0 8px; border: 1px solid var(--line); border-left: 0;
    border-radius: 0 10px 10px 0; color: var(--dim); font-style: normal; cursor: pointer; }
  #presets .pw i:hover { color: #fca5a5; }
  #presets .add { border-style: dashed; color: #94a3b8; }
  #bCopy { display: block; margin-top: 10px; width: 100%; }

  /* ===== the view: one or two phone screens with the game's real words ===== */
  #view { position: fixed; top: 64px; bottom: 80px; left: 0; overflow-y: auto; display: flex; gap: 16px; justify-content: center;
    align-items: flex-start; padding: 0 16px 16px; box-sizing: border-box; }
  .phone { flex: 0 1 390px; min-width: 0; max-width: 390px; }
  .cap { font: 600 12px system-ui, sans-serif; color: #94a3b8; margin: 0 0 6px; display: flex; justify-content: space-between; gap: 8px; }
  .cap b { color: var(--ink); }
  .cap .ok { color: #4ade80; } .cap .bad { color: #fbbf24; }
  .screen { background: #0d1530; border: 1px solid #1f2b52; border-radius: 16px; padding: 16px; box-sizing: border-box;
    color: #dbe7ff; -webkit-font-smoothing: none; -moz-osx-font-smoothing: grayscale; font-smooth: never;
    text-rendering: optimizeSpeed; font-synthesis: none; font-kerning: none; }
  .screen > * + * { margin-top: 12px; }
  .t-title, .t-head { text-transform: uppercase; color: #fff; }
  .t-title { color: #7dd3fc; }
  .card { background: #142048; border: 1px solid #2a3a70; border-radius: 10px; padding: 12px; }
  .row { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 12px; align-items: baseline; }
  .row > :last-child { margin-left: auto; }
  .row + .row { margin-top: 6px; }
  .num { color: #f2c14e; white-space: nowrap; }
  .minus { color: #fca5a5; white-space: nowrap; }
  .monitor { background: #031208; border: 2px solid #f6a43a; border-radius: 10px; padding: 12px; color: #7cff9b; text-transform: uppercase; }
  .bubble { background: #e9eef8; color: #10172e; border-radius: 12px; padding: 10px 12px; }
  .who { color: #5b6b8f; }
  .btn { display: block; text-align: center; background: #23d18b; color: #062016; border-radius: 10px; padding: 10px 12px; text-transform: uppercase; }
  .meter { height: 8px; border-radius: 4px; background: #2a3a70; margin-top: 8px; }
</style>
</head>
<body>
<div id="view"></div>
<div class="bar" id="top">
  <div id="fps">-- fps</div>
  <button id="bReset">Reset</button><button id="bKnobs">Knobs</button>
</div>
<div id="panel"></div>
<div class="bar" id="bottom">
  <button id="bPrev">◀ Look</button><button id="bCompare">Compare with Today</button><button id="bNext">Look ▶</button>
</div>
<script>
'use strict';
const $ = id => document.getElementById(id);

// ===== Tweakable values (the sketch's "content/*.json"). Every knob lives here. =====
const GOO = {
  // defaults = Muzzy's pick 2026-10-29 (B, reading text 16 screen px, tight lines, no shadow / spacing) — picks.json
  look: 2,          // 0 Today · 1 A all Nokia · 2 B Nokia + Pixel Operator · 3 B2 Nokia + m6x11plus
  compare: 0,       // 1 = Today beside the chosen look (when there's room)
  textSize: 100,    // the player's Text size setting, %
  snap: 1,          // 1 = every size lands on the font's pixel grid (crisp); 0 = sizes as they come
  bodySize: 16,     // the reading text's target size in px (A, B, B2) — snapped to its font's grid
  lineHeight: 1.2,  // line height × size (Today keeps its 1.4)
  shadow: 0,        // hard shadow under titles + headings, in font pixels (0 = none)
  tracking: 0,      // extra letter spacing on titles + headings, in font pixels
};
// [name, min, max, step] rows; a one-item row is a group heading. 5–8 sliders max.
const KNOBS = [['Which look'], ['look', 0, 3, 1], ['compare', 0, 1, 1],
  ['Size'], ['textSize', 100, 200, 25], ['snap', 0, 1, 1], ['bodySize', 12, 36, 2], ['lineHeight', 1.2, 1.8, 0.05],
  ['Emphasis'], ['shadow', 0, 2, 1], ['tracking', 0, 2, 0.5]];
// One line per knob: what it does IN THIS SKETCH, and when you'd notice it.
const KNOB_HELP = {
  look: '0 Today (the game now) · 1 A: all Nokia on sharp sizes · 2 B: Nokia + Pixel Operator for reading text · 3 B2: Nokia + m6x11plus for reading text.',
  compare: '1 = Today\'s look beside the one you picked (needs a wide window); 0 = just the picked look.',
  textSize: 'The game\'s Text size setting. Watch the sizes in the header line jump between sharp steps when snap is on.',
  snap: '1 = sizes land on the font\'s pixel grid, so every font pixel is a whole screen pixel (crisp). 0 = sizes as they come — edges go soft or uneven.',
  bodySize: 'How big the reading text (rows, monitor, the Veteran, payday) aims to be — each font then snaps to its own sharp step (Nokia + Pixel Operator 8: 16 / 24 / 32; m6x11plus: 18 / 36). Try 16 vs 24.',
  lineHeight: 'Space between lines in the Veteran\'s line and the payday text. Higher = airier, longer screens.',
  shadow: 'A hard 1-pixel shadow under titles and headings — stands in for bold (Nokia has no bold).',
  tracking: 'Extra space between letters in CAPS titles and headings — makes caps easier to read.',
};

// ===== The sketch itself =====
const LOOKS = [
  { name: 'Today', note: 'the kit sizes now (body 18 × 1.25 steps, line height 1.4)', today: true,
    roles: { body: ['Nokia Cellphone FC', 8, 18], small: ['Nokia Cellphone FC', 8, 13.5], head: ['Nokia Cellphone FC', 8, 22.5], title: ['Nokia Cellphone FC', 8, 28.125] } },
  { name: 'A · all Nokia', note: 'Nokia everywhere, 16 / 24 / 32',
    roles: { body: ['Nokia Cellphone FC', 8, 16], small: ['Nokia Cellphone FC', 8, 16], head: ['Nokia Cellphone FC', 8, 24], title: ['Nokia Cellphone FC', 8, 32] } },
  { name: 'B · Nokia + Pixel Operator', note: 'reading text in Pixel Operator 8 (CC0, has a bold)',
    roles: { body: ['Pixel Operator', 8, 16], small: ['Nokia Cellphone FC', 8, 16], head: ['Nokia Cellphone FC', 8, 24], title: ['Nokia Cellphone FC', 8, 32] } },
  { name: 'B2 · Nokia + m6x11plus', note: 'reading text in m6x11plus 18 (free, credit Daniel Linssen)',
    roles: { body: ['m6x11plus', 18, 18], small: ['Nokia Cellphone FC', 8, 16], head: ['Nokia Cellphone FC', 8, 24], title: ['Nokia Cellphone FC', 8, 32] } },
];
let dpr = 1;
// a role's size in CSS px: Text size applied, then (snap) rounded to the font's grid ÷ the screen's pixel ratio
function sizeOf(look, role) {
  const [, grid, fixed] = look.roles[role], base = !look.today && role === 'body' ? GOO.bodySize : fixed, raw = base * GOO.textSize / 100;
  if (look.today || !GOO.snap) return raw;
  const step = grid / dpr;
  return Math.max(step, Math.round(raw / step) * step);
}
const onGrid = (look, role) => { const [, grid] = look.roles[role], dev = sizeOf(look, role) * dpr; return Math.abs(dev / grid - Math.round(dev / grid)) < 0.01; };
function style(look, role, lines) {
  const [font, grid] = look.roles[role], size = sizeOf(look, role);
  const lhRaw = (look.today ? 1.4 : GOO.lineHeight) * size;
  const lh = look.today || !GOO.snap ? lhRaw : Math.round(lhRaw * dpr) / dpr;
  let s = `font-family:'${font}',monospace;font-size:${size}px;line-height:${lh}px;font-weight:400;`;
  if (!look.today && (role === 'head' || role === 'title')) {
    const fp = size / grid; // one font pixel, in CSS px
    if (GOO.shadow > 0) s += `text-shadow:${GOO.shadow * fp}px ${GOO.shadow * fp}px 0 #000c;`;
    s += `letter-spacing:${GOO.tracking * fp}px;`;
  }
  return s;
}
function screenHtml(look) {
  const st = r => `style="${style(look, r)}"`;
  // sizes in REAL screen pixels (page px × the screen's pixel ratio — Windows / browser zoom 110% makes 16 screen px = 14.55 page px)
  const sizes = ['body', 'head', 'title'].map(r => `${r === 'head' ? 'heading' : r} ${+(sizeOf(look, r) * dpr).toFixed(1)}`).join(' · ')
    + (Math.abs(dpr - 1) > 0.01 ? ` screen px (your zoom ${Math.round(dpr * 100)}%)` : ' screen px');
  const crisp = look.today ? ['body', 'head', 'title'].every(r => onGrid(look, r)) : ['body', 'head', 'title', 'small'].every(r => onGrid(look, r));
  return `<div class="phone"><div class="cap"><span><b>${look.name}</b> — ${look.note}</span></div>
  <div class="cap"><span>${sizes}</span><span class="${crisp ? 'ok' : 'bad'}">${crisp ? 'all on grid ✓' : 'off grid — soft'}</span></div>
  <div class="screen">
    <div class="t-title" ${st('title')}>Settings</div>
    <div class="t-head" ${st('head')}>Volume</div>
    <div class="card"><div class="row" ${st('body')}><span>Master volume</span><span class="num">80</span></div>
      <div class="row" ${st('body')}><span>Mute when in the background</span><span class="num">On</span></div></div>
    <div class="card"><div class="row"><span class="t-head" ${st('head')}>Operator rank 0</span><span class="num" ${st('small')}>0 / 3,500 DUE</span></div><div class="meter"></div></div>
    <div class="monitor" ${st('body')}>Welcome, operator #4471. Your passage debt has been pre-approved.</div>
    <div class="bubble" ${st('body')}><span class="who">Veteran:</span> Pressure's not a side effect, kid. ...forget I said that.</div>
    <div class="card"><div class="t-head" ${st('head')}>Payday</div>
      <div ${st('body')} style="margin-top:6px">Payment due: 3,500 cr. Thank you for your continued employment.</div>
      <div class="row" ${st('body')} style="margin-top:8px"><span>Unauthorised wear on Company laser</span><span class="minus">−40</span></div>
      <div class="row" ${st('body')}><span>Sighing above approved volume</span><span class="minus">−5</span></div>
      <div class="row" ${st('body')}><span>Remaining passage debt</span><span class="num">12,480 cr</span></div></div>
    <div class="btn" ${st('head')}>Start shift</div>
  </div></div>`;
}
// (style() returns one style attribute; a second style= on the same tag is merged here)
function mergeStyles(html) { return html.replace(/style="([^"]*)"\s+style="([^"]*)"/g, 'style="$1$2"'); }
let drawn = '';
function draw() {
  const look = LOOKS[Math.max(0, Math.min(3, Math.round(GOO.look)))];
  const both = GOO.compare >= 0.5 && !look.today && playW() >= 860;
  const html = mergeStyles((both ? screenHtml(LOOKS[0]) : '') + screenHtml(look));
  if (html !== drawn) { $('view').innerHTML = html; drawn = html; }
  $('bCompare').classList.toggle('on', GOO.compare >= 0.5);
}
function update() {}
function layout() {
  dockKnobs();
  dpr = devicePixelRatio || 1;
  $('view').style.width = playW() + 'px';
  drawn = '';
}
function reset() { setKnobs(DEFAULTS); activePreset = 'd'; drawPresets(); }
function stepLook(d) { GOO.look = (Math.round(GOO.look) + d + 4) % 4; showKnob('look'); }
$('bReset').onclick = reset;
$('bPrev').onclick = () => stepLook(-1); $('bNext').onclick = () => stepLook(1);
$('bCompare').onclick = () => { GOO.compare = GOO.compare >= 0.5 ? 0 : 1; showKnob('compare'); };

// ===== Sketch kit (keep as is): docked knobs, presets, copy values, help lines, fps =====
const SIDE = 300;
function dockKnobs() {
  const p = $('panel'), open = p.classList.contains('open'), wide = innerWidth >= 700;
  document.body.classList.toggle('side', open && wide);
  document.body.classList.toggle('sheet', open && !wide);
  document.body.style.setProperty('--sheet', open && !wide ? p.offsetHeight + 'px' : '0px');
}
function playW() { return document.body.classList.contains('side') ? innerWidth - SIDE : innerWidth; }
$('panel').innerHTML = '<div id="presets"></div>' + KNOBS.map(([k, lo, hi, st]) => lo === undefined ? `<h4>${k}</h4>` :
  `<label><span>${k}</span><input type="range" id="k_${k}" min="${lo}" max="${hi}" step="${st}" value="${GOO[k]}"><input class="num" type="number" inputmode="decimal" id="v_${k}" step="${st}" value="${GOO[k]}" title="Type any value, even past the slider's ends"></label>`
  + (KNOB_HELP[k] ? `<div class="help">${KNOB_HELP[k]}</div>` : '')).join('')
  + '<button id="bCopy">Copy values for Claude</button>';
function showKnob(k) {
  const row = KNOBS.find(r => r[0] === k), v = GOO[k], box = $('v_' + k);
  $('k_' + k).value = v; if (document.activeElement !== box) box.value = v;
  box.classList.toggle('over', v < row[1] || v > row[2]);
}
for (const [k, lo] of KNOBS) if (lo !== undefined) {
  const box = $('v_' + k); let before = GOO[k];
  $('k_' + k).oninput = e => { GOO[k] = +e.target.value; showKnob(k); };
  box.onfocus = () => { before = GOO[k]; };
  box.oninput = () => { const v = parseFloat(box.value); if (Number.isFinite(v)) { GOO[k] = v; showKnob(k); } };
  box.onkeydown = e => {
    if (e.key === 'Enter') box.blur();
    if (e.key === 'Escape') { GOO[k] = before; box.value = before; showKnob(k); box.blur(); }
  };
  box.onblur = () => { box.value = GOO[k]; showKnob(k); };
}
$('bKnobs').onclick = () => {
  $('panel').classList.toggle('open'); $('bKnobs').classList.toggle('on'); layout();
  try { localStorage.setItem('sketch-knobs-open', $('panel').classList.contains('open') ? '1' : '0'); } catch (e) {}
};
const PKEY = 'sketch-presets:' + location.pathname.split('/').pop();
function readKnobs() { const v = {}; for (const [k, lo] of KNOBS) if (lo !== undefined) v[k] = GOO[k]; return v; }
function setKnobs(v) { for (const [k, lo] of KNOBS) if (lo !== undefined && k in v) { GOO[k] = v[k]; showKnob(k); } }
const DEFAULTS = readKnobs();
let presets = [], activePreset = 'd';
try { presets = JSON.parse(localStorage.getItem(PKEY)) || []; } catch (e) {}
function savePresets() { try { localStorage.setItem(PKEY, JSON.stringify(presets)); } catch (e) {} }
function drawPresets() {
  $('presets').innerHTML = `<button data-i="d" class="${activePreset === 'd' ? 'on' : ''}">Default</button>`
    + presets.map((p, i) => `<span class="pw"><button data-i="${i}" class="${activePreset === i ? 'on' : ''}">${p.name}</button><i data-x="${i}" title="Delete">&times;</i></span>`).join('')
    + (presets.length < 3 ? '<button data-i="+" class="add">+ Preset</button>' : '');
}
$('presets').onclick = e => {
  const x = e.target.dataset.x, i = e.target.dataset.i;
  if (x !== undefined) { presets.splice(+x, 1); activePreset = null; savePresets(); }
  else if (i === 'd') { setKnobs(DEFAULTS); activePreset = 'd'; }
  else if (i === '+') {
    let n = 1; while (presets.some(p => p.name === 'Preset ' + n)) n++;
    presets.push({ name: 'Preset ' + n, values: readKnobs() }); activePreset = presets.length - 1; savePresets();
  }
  else if (i !== undefined) { setKnobs(presets[+i].values); activePreset = +i; }
  drawPresets();
};
drawPresets();
$('bCopy').onclick = () => {
  const text = document.title + String.fromCharCode(10) + JSON.stringify({ now: readKnobs(), presets }, null, 1);
  const done = ok => { $('bCopy').textContent = ok ? 'Copied! Paste it in the chat' : 'Copy blocked: open full screen and try again';
    setTimeout(() => $('bCopy').textContent = 'Copy values for Claude', 2500); };
  (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).then(() => done(true), () => done(false));
};
try { if (innerWidth >= 700 && localStorage.getItem('sketch-knobs-open') !== '0') { $('panel').classList.add('open'); $('bKnobs').classList.add('on'); } } catch (e) {}
addEventListener('resize', layout);
layout();
let last = performance.now(), acc = 0, frames = 0, fpsT = 0;
const STEP = 1 / 120;
function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.1); last = now;
  acc += dt; while (acc >= STEP) { update(STEP); acc -= STEP; }
  draw();
  frames++; fpsT += dt; if (fpsT >= 1) { $('fps').textContent = Math.round(frames / fpsT) + ' fps'; frames = 0; fpsT = 0; }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.sketch = { GOO, readKnobs, setKnobs, sizeOf: (l, r) => sizeOf(LOOKS[l], r) }; // for Playwright checks
</script>
</body>
</html>
