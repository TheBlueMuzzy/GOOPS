<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<!-- /sketch starter (BMUZ). The planner's Sketches tab uses the title as the tab name and the description as its blurb. -->
<title>S13: Periscope zoom</title>
<meta name="description" content="F56 (2026-11-01): pulling the periscope down — A zooms into its goggles until the lens is the tank, B does the same and shows the tank live and small in the goggles at the console, C is today's slide. Pull it down and back up (buttons, arrow keys or a swipe) and ask: does it feel like looking into the periscope?">
<style>
  :root { --bg: #05070d; --panel: #0b1224f0; --line: #1e293b; --ink: #e2e8f0; --dim: #64748b; --accent: #a855f7; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: #cbd5e1;
    font-family: system-ui, -apple-system, Segoe UI, sans-serif; user-select: none; -webkit-user-select: none; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .bar { position: fixed; left: 0; right: 0; margin: 0 auto; max-width: 560px; box-sizing: border-box;
    display: flex; gap: 8px; align-items: center; padding: 10px 16px; z-index: 2; }
  #top { top: 0; padding-top: max(10px, env(safe-area-inset-top)); }
  #bottom { bottom: 0; padding-bottom: max(14px, env(safe-area-inset-bottom)); }
  button { flex: 1; min-height: 40px; padding: 0 6px; border-radius: 12px; border: 1px solid var(--line);
    background: #0b1224d9; color: var(--ink); font: 600 14px system-ui, sans-serif; touch-action: manipulation; cursor: pointer; }
  button:active { background: var(--line); }
  button.on { border-color: var(--accent); color: #e9d5ff; }
  button:disabled { opacity: .4; cursor: default; }
  #bottom button { min-height: 56px; font-size: 17px; }
  #fps { flex: 0 0 64px; font: 700 13px ui-monospace, monospace; color: #4ade80; }
  /* Knobs: beside the view on a wide screen (Muzzy tunes on the PC), a bottom sheet on a phone. Never over the view. */
  #panel { position: fixed; z-index: 3; display: none; box-sizing: border-box; background: var(--panel); overflow-y: auto; }
  #panel.open { display: block; }
  body.side #panel { top: 0; bottom: 0; right: 0; width: 300px; border-left: 1px solid var(--line); padding: max(16px, env(safe-area-inset-top)) 16px 16px; }
  body.side .bar { right: 300px; }
  body.sheet #panel { left: 0; right: 0; bottom: 0; max-height: 40vh; border-top: 1px solid var(--line); border-radius: 14px 14px 0 0;
    padding: 12px 16px max(12px, env(safe-area-inset-bottom)); }
  body.sheet #bottom { bottom: var(--sheet, 0px); padding-bottom: 8px; }
  #panel h4 { margin: 6px 0 2px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); }
  #panel label { display: flex; align-items: center; gap: 10px; font-size: 13px; margin: 6px 0; }
  #panel label span { flex: 0 0 84px; }
  #panel input[type=range] { flex: 1; min-width: 0; accent-color: var(--accent); }
  /* the value box: type any number, even past the slider's ends (the slider then sits at its end, the box turns amber) */
  #panel input.num { flex: 0 0 52px; width: 52px; box-sizing: border-box; padding: 3px 4px; text-align: right; font: 600 12px ui-monospace, monospace;
    color: #94a3b8; background: #0b1224; border: 1px solid var(--line); border-radius: 6px; -moz-appearance: textfield; }
  #panel input.num::-webkit-inner-spin-button, #panel input.num::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  #panel input.num:focus { outline: none; border-color: var(--accent); color: var(--ink); }
  #panel input.num.over { color: #fbbf24; border-color: #fbbf2480; }
  #panel .help { margin: -4px 0 8px; font-size: 11px; line-height: 1.35; color: var(--dim); }
  #presets { display: flex; flex-wrap: wrap; gap: 6px; margin: 2px 0 10px; }
  #presets button, #bCopy { flex: 0 0 auto; min-height: 32px; padding: 0 12px; font-size: 13px; border-radius: 10px; }
  #presets .pw { display: inline-flex; }
  #presets .pw button { border-radius: 10px 0 0 10px; }
  #presets .pw i { display: flex; align-items: center; padding: 0 8px; border: 1px solid var(--line); border-left: 0;
    border-radius: 0 10px 10px 0; color: var(--dim); font-style: normal; cursor: pointer; }
  #presets .pw i:hover { color: #fca5a5; }
  #presets .add { border-style: dashed; color: #94a3b8; }
  #bCopy { display: block; margin-top: 10px; width: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="bar" id="top">
  <div id="fps">-- fps</div>
  <button id="bReset">Reset</button><button id="bKnobs">Knobs</button>
</div>
<div id="panel"></div>
<div class="bar" id="bottom">
  <button id="bPull">Pull the periscope ↓</button><button id="bBack">Back to the console ↑</button>
</div>

const NEXT = { pull: 'in', in: 'tank', out: 'lift', lift: 'console' };
function pull() { if (S.phase === 'console') { S.phase = 'pull'; S.t = 0; } }
function back() { if (S.phase === 'tank') { S.phase = 'out'; S.t = 0; } }
function reset() { S.phase = 'console'; S.t = 0; S.hold = false; tank.reset(); }
function easeIO(t) { const k = GOO.ease; return t < 0.5 ? 0.5 * Math.pow(2 * t, k) : 1 - 0.5 * Math.pow(2 - 2 * t, k); }
const clamp01 = v => Math.max(0, Math.min(1, v));
// where we are: pullAmt (0 up … 1 down) and sw (the switch: 0 = console … 1 = tank), both eased
function progress() {
  const e = easeIO(clamp01(S.t)), p = S.phase;
  return { pullAmt: p === 'pull' ? e : p === 'lift' ? 1 - e : p === 'console' ? 0 : 1,
           sw: p === 'in' ? e : p === 'out' ? 1 - e : p === 'tank' ? 1 : 0 };
}

// --- the stand-in tank: goo blobs falling into an 8 × 14 grid, settling, clearing when it fills
const tank = {
  cols: 8, rows: 14, cells: [], falling: [], timer: 0, clear: 0,
  COLOURS: ['#ef4444', '#3b82f6', '#22c55e', '#facc15', '#a855f7'],
  reset() { this.cells = Array.from({ length: this.cols }, () => []); this.falling = []; this.timer = 0; this.clear = 0;
    for (let c = 0; c < this.cols; c++) for (let r = 0; r < (c * 5) % 4 + 1; r++) this.cells[c].push(this.COLOURS[(c + r * 2) % 5]); },
  update(dt) {
    if (this.clear > 0) { this.clear -= dt; if (this.clear <= 0) this.reset(); return; }
    this.timer -= dt;
    if (this.timer <= 0) { this.timer = 0.35; const c = Math.floor(Math.random() * this.cols);
      this.falling.push({ c, y: -1, v: 0, col: this.COLOURS[Math.floor(Math.random() * 5)] }); }
    for (const b of this.falling) { b.v = Math.min(b.v + 30 * dt, 14); b.y += b.v * dt; }
    this.falling = this.falling.filter(b => {
      const floor = this.rows - 1 - this.cells[b.c].length;
      if (b.y < floor) return true;
      this.cells[b.c].push(b.col); if (this.cells[b.c].length >= this.rows - 2) this.clear = 0.6; return false;
    });
  },
  // the tank as it shows full screen: the play area (left of the docked knobs), its grid between the two bars
  draw(g, w, h, top, bottom) {
    g.fillStyle = '#071214'; g.fillRect(0, 0, w, h);
    const availH = h - top - bottom - 16, cell = Math.min((w - 32) / this.cols, availH / this.rows);
    const gw = cell * this.cols, gh = cell * this.rows, x0 = (w - gw) / 2, y0 = top + 8 + (availH - gh) / 2;
    this.geo = { cell, floorX: x0 + gw / 2, floorY: y0 + gh };   // where the vat's floor centre is in this picture (px)
    g.fillStyle = '#0f2a2f'; g.strokeStyle = '#2f7f86'; g.lineWidth = 3;
    g.beginPath(); g.roundRect(x0 - 6, y0 - 6, gw + 12, gh + 12, 14); g.fill(); g.stroke();
    g.strokeStyle = '#17363b'; g.lineWidth = 1;
    for (let c = 1; c < this.cols; c++) { g.beginPath(); g.moveTo(x0 + c * cell, y0); g.lineTo(x0 + c * cell, y0 + gh); g.stroke(); }
    const blob = (c, y, col, a) => { const cx = x0 + (c + 0.5) * cell, cy = y0 + (y + 0.5) * cell, r = cell * 0.44;
      g.globalAlpha = a; g.fillStyle = col; g.beginPath(); g.arc(cx, cy, r, 0, Math.PI * 2); g.fill();
      g.fillStyle = '#ffffff55'; g.beginPath(); g.arc(cx - r * 0.35, cy - r * 0.35, r * 0.28, 0, Math.PI * 2); g.fill(); g.globalAlpha = 1; };
    const a = this.clear > 0 ? this.clear / 0.6 : 1;
    for (let c = 0; c < this.cols; c++) this.cells[c].forEach((col, i) => blob(c, this.rows - 1 - i, col, a));
    for (const b of this.falling) blob(b.c, b.y, b.col, 1);
  },
};
tank.reset();
const tankCanvas = document.createElement('canvas'), tctx = tankCanvas.getContext('2d');

function update(dt) {
  tank.update(dt);
  if (S.hold || !DUR[S.phase]) return;
  S.t += dt * 1000 / Math.max(1, DUR[S.phase]());
  if (S.t >= 1) { S.phase = NEXT[S.phase]; S.t = 0; }
}

// the console's place on screen: the view fitted between the bars, at the bottom (the game's ArtStage: bleed, align end)
let barTop = 60, barBottom = 84;
function baseFit() {
  const availH = viewH - barTop - barBottom, s = Math.min(viewW / VIEW[2], availH / VIEW[3]);
  return { s, ox: (viewW - VIEW[2] * s) / 2 - VIEW[0] * s, oy: barTop + availH - VIEW[3] * s - VIEW[1] * s };
}

function draw() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.fillStyle = '#05070d'; ctx.fillRect(0, 0, innerWidth, innerHeight);
  // the tank, drawn once a frame at its full-screen size (the zoom then places this picture)
  tctx.setTransform(dpr, 0, 0, dpr, 0, 0); tank.draw(tctx, viewW, viewH, barTop, barBottom);
  if (ready < Object.keys(ART).length) return;
  const { pullAmt, sw } = progress(), style = Math.round(GOO.style), base = baseFit();
  const pullY = pullAmt * TRAVEL, Lx = LENS.cx, Ly = LENS.cy + pullY;
  const C = { x: viewW / 2, y: viewH / 2 };
  // the zoom: the scale grows steadily (log), and the lens moves to the screen's centre as it grows — like zooming at a point
  const s1 = GOO.zoom * viewH / LENS.h;
  let s = base.s, ox = base.ox, oy = base.oy, slide = 0;
  if (style < 2 && sw > 0) {
    s = base.s * Math.pow(s1 / base.s, sw);
    const w = (s - base.s) / (s1 - base.s || 1);
    const px = (base.s * Lx + base.ox) * (1 - w) + C.x * w, py = (base.s * Ly + base.oy) * (1 - w) + C.y * w;
    ox = px - s * Lx; oy = py - s * Ly;
  }
  if (style === 2) slide = sw * viewH;
  // the tank's place, in mock-up units (m = units per picture px). Muzzy 2026-11-01: the goggles' glass is FILLED with
  // the game, looking close at the bottom of the vat — lensCols columns span the glass edge to edge, the vat's floor just
  // above the glass's bottom edge (the rest of the tank is above, out of view). At the end of the zoom it is exactly the
  // full-screen tank. In between, the size changes steadily (log) and the floor point glides from one place to the other,
  // so on screen the goo stays about the same size while the window opens round it.
  const G = tank.geo, m0 = LENS.w / (GOO.lensCols * G.cell), m1 = 1 / s1;
  const m = m0 * Math.pow(m1 / m0, sw);
  const floor0 = { x: Lx, y: LENS_BOTTOM + pullY - FLOOR_LIFT };                    // at the console
  const floor1 = { x: Lx - viewW * m1 / 2 + G.floorX * m1, y: Ly - viewH * m1 / 2 + G.floorY * m1 };   // the full-screen tank
  const fx = floor0.x + (floor1.x - floor0.x) * sw, fy = floor0.y + (floor1.y - floor0.y) * sw;
  const tw = viewW * m, th = viewH * m, tx = fx - G.floorX * m, ty = fy - G.floorY * m;
  const consoleA = style < 2 ? clamp01((1 - sw) / 0.2) : 1;   // A/B: the frame fades in the last fifth (no jump at a low zoom)
  const glassA = style === 2 ? 1 : (style === 1 ? GLASS_TINT : 1) * (1 - clamp01(sw / GOO.glassFade));
  const tankShows = style === 1 || (style === 0 && sw > 0);

  if (S.phase === 'tank') { ctx.drawImage(tankCanvas, 0, 0, viewW, viewH); return; }
  const U = () => ctx.setTransform(dpr * s, 0, 0, dpr * s, dpr * ox, dpr * (oy + slide));   // mock-up units → screen
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, viewW, viewH); ctx.clip();   // only the play area (left of the docked knobs)
  // under everything: C slides the console off the tank; A/B show the tank where the lens takes it as the frame fades
  if (style === 2 && sw > 0) ctx.drawImage(tankCanvas, 0, 0, viewW, viewH);
  else if (style < 2 && sw > 0) { U(); ctx.fillStyle = '#071214'; ctx.fillRect(-5000, -5000, 12000, 12000); ctx.drawImage(tankCanvas, tx, ty, tw, th); }
  // C: the console is a screen that slides away as one piece — nothing of it shows above its top edge (the game's Screen)
  if (style === 2) { ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.beginPath(); ctx.rect(0, slide, viewW, viewH); ctx.clip(); }
  ctx.globalAlpha = consoleA;
  // backdrop: the whole screen behind the console (it slides with it in C)
  U(); ctx.fillStyle = BACKDROP; ctx.fillRect(-5000, VIEW[1] - 5000, 12000, 12000 + VIEW[3]);
  for (const [k2, x, y, w, h] of LAYERS) ctx.drawImage(imgs[k2], x, y, w, h);
  ctx.translate(0, pullY);
  ctx.drawImage(imgs.periscope, PERI[0], PERI[1], PERI[2], PERI[3]);
  ctx.globalAlpha = 1;
  // the goggles' lens: the tank behind the glass (B always, A once the zoom starts), then the painted glass over it
  ctx.save(); ctx.clip(LENS_PATH);
  if (tankShows) { ctx.fillStyle = '#071214'; ctx.fill(LENS_PATH); ctx.drawImage(tankCanvas, tx, ty - pullY, tw, th); }
  ctx.globalAlpha = glassA; ctx.fillStyle = '#0b1c3f'; ctx.fill(LENS_PATH); ctx.fillStyle = '#373a60'; ctx.fill(INNER_PATH);
  ctx.restore(); ctx.globalAlpha = consoleA;
  ctx.translate(0, -pullY);
  ctx.drawImage(imgs.monitor, MONITOR[0], MONITOR[1], MONITOR[2], MONITOR[3]);
  // the monitor's words (the game's CRT hint: phosphor green, glowing)
  ctx.font = `700 ${HINT_TEXT}px ui-monospace, Consolas, monospace`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.shadowColor = '#5bf08a'; ctx.shadowBlur = 8 * s * dpr; ctx.fillStyle = '#7dffa1';
  ctx.fillText('PULL DOWN THE PERISCOPE', HINT[0] + HINT[2] / 2, HINT[1] + HINT[3] / 2, HINT[2]);
  ctx.shadowBlur = 0; ctx.globalAlpha = 1;
  if (style === 2 && sw > 0) { ctx.globalAlpha = sw * 0.4; ctx.fillStyle = '#000'; ctx.fillRect(-5000, VIEW[1] - 5000, 12000, 12000 + VIEW[3]); ctx.globalAlpha = 1; }
  ctx.restore();
}
function layout() {
  dockKnobs();
  dpr = Math.min(devicePixelRatio || 1, 2);
  canvas.width = Math.round(innerWidth * dpr); canvas.height = Math.round(innerHeight * dpr);
  viewW = playW(); viewH = innerHeight; // the view lives left of the docked knobs, at full size
  tankCanvas.width = Math.round(viewW * dpr); tankCanvas.height = Math.round(viewH * dpr);
  barTop = $('top').offsetHeight; barBottom = $('bottom').offsetHeight + parseFloat(getComputedStyle(document.body).getPropertyValue('--sheet') || 0);
}
function showButtons() { $('bPull').disabled = S.phase !== 'console'; $('bBack').disabled = S.phase !== 'tank'; }
$('bReset').onclick = reset; $('bPull').onclick = pull; $('bBack').onclick = back;
addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('input')) return;
  if (e.key === 'ArrowDown') { pull(); e.preventDefault(); } if (e.key === 'ArrowUp') { back(); e.preventDefault(); }
});
// swipe: down on the console pulls the periscope, up in the tank goes back
let swipeY = null;
canvas.addEventListener('pointerdown', e => { swipeY = e.clientY; });
canvas.addEventListener('pointerup', e => { if (swipeY === null) return; const dy = e.clientY - swipeY; swipeY = null;
  if (dy > 40) pull(); else if (dy < -40) back(); });

// ===== Sketch kit (keep as is): docked knobs, presets, copy values, help lines, fps =====
const SIDE = 300;
function dockKnobs() {
  const p = $('panel'), open = p.classList.contains('open'), wide = innerWidth >= 700;
  document.body.classList.toggle('side', open && wide);
  document.body.classList.toggle('sheet', open && !wide);
  document.body.style.setProperty('--sheet', open && !wide ? p.offsetHeight + 'px' : '0px');
}
function playW() { return document.body.classList.contains('side') ? innerWidth - SIDE : innerWidth; }
$('panel').innerHTML = '<div id="presets"></div>' + KNOBS.map(([k, lo, hi, st]) => lo === undefined ? `<h4>${k}</h4>` :
  `<label><span>${k}</span><input type="range" id="k_${k}" min="${lo}" max="${hi}" step="${st}" value="${GOO[k]}"><input class="num" type="number" inputmode="decimal" id="v_${k}" step="${st}" value="${GOO[k]}" title="Type any value, even past the slider's ends"></label>`
  + (KNOB_HELP[k] ? `<div class="help">${KNOB_HELP[k]}</div>` : '')).join('')
  + '<button id="bCopy">Copy values for Claude</button>';
// show a value in both the slider (pinned at its end when past it) and the box (amber when past the slider's ends)
function showKnob(k) {
  const row = KNOBS.find(r => r[0] === k), v = GOO[k], box = $('v_' + k);
  $('k_' + k).value = v; if (document.activeElement !== box) box.value = v;
  box.classList.toggle('over', v < row[1] || v > row[2]);
}
// typing in the box updates the sketch live; Enter or leaving the box applies, Escape puts back what was there
for (const [k, lo] of KNOBS) if (lo !== undefined) {
  const box = $('v_' + k); let before = GOO[k];
  $('k_' + k).oninput = e => { GOO[k] = +e.target.value; showKnob(k); };
  box.onfocus = () => { before = GOO[k]; };
  box.oninput = () => { const v = parseFloat(box.value); if (Number.isFinite(v)) { GOO[k] = v; showKnob(k); } };
  box.onkeydown = e => {
    if (e.key === 'Enter') box.blur();
    if (e.key === 'Escape') { GOO[k] = before; box.value = before; showKnob(k); box.blur(); }
  };
  box.onblur = () => { box.value = GOO[k]; showKnob(k); };
}
$('bKnobs').onclick = () => {
  $('panel').classList.toggle('open'); $('bKnobs').classList.toggle('on'); layout();
  try { localStorage.setItem('sketch-knobs-open', $('panel').classList.contains('open') ? '1' : '0'); } catch (e) {}
};
// Presets: + Preset saves the current knobs (up to 3); tap one to load it; × deletes. Stored in this browser only.
const PKEY = 'sketch-presets-v2:' + location.pathname.split('/').pop();   // v2: lensCols replaced lensTank (Muzzy, 2026-11-01)
function readKnobs() { const v = {}; for (const [k, lo] of KNOBS) if (lo !== undefined) v[k] = GOO[k]; return v; }
function setKnobs(v) { for (const [k, lo] of KNOBS) if (lo !== undefined && k in v) { GOO[k] = v[k]; showKnob(k); } }
const DEFAULTS = readKnobs();
let presets = [], activePreset = 'd';
try { presets = JSON.parse(localStorage.getItem(PKEY)) || []; } catch (e) {}
// (this sketch starts with its three looks as the presets — delete one with × to save your own)
try { if (localStorage.getItem(PKEY) === null) presets = [
  { name: 'A zoom', values: { ...DEFAULTS, style: 0, zoom: 1.8, glassFade: 0.6, zoomMs: 800, backMs: 600, ease: 3 } },
  { name: 'B lens', values: { ...DEFAULTS } },
  { name: 'C slide', values: { ...DEFAULTS, style: 2, zoomMs: 600, backMs: 600, ease: 2.5 } }]; } catch (e) {}
function savePresets() { try { localStorage.setItem(PKEY, JSON.stringify(presets)); } catch (e) {} }
function drawPresets() {
  $('presets').innerHTML = `<button data-i="d" class="${activePreset === 'd' ? 'on' : ''}">Default</button>`
    + presets.map((p, i) => `<span class="pw"><button data-i="${i}" class="${activePreset === i ? 'on' : ''}">${p.name}</button><i data-x="${i}" title="Delete">&times;</i></span>`).join('')
    + (presets.length < 3 ? '<button data-i="+" class="add">+ Preset</button>' : '');
}
$('presets').onclick = e => {
  const x = e.target.dataset.x, i = e.target.dataset.i;
  if (x !== undefined) { presets.splice(+x, 1); activePreset = null; savePresets(); }
  else if (i === 'd') { setKnobs(DEFAULTS); activePreset = 'd'; }
  else if (i === '+') {
    let n = 1; while (presets.some(p => p.name === 'Preset ' + n)) n++;
    presets.push({ name: 'Preset ' + n, values: readKnobs() }); activePreset = presets.length - 1; savePresets();
  }
  else if (i !== undefined) { setKnobs(presets[+i].values); activePreset = +i; }
  drawPresets();
};
drawPresets();
$('bCopy').onclick = () => {
  const text = document.title + String.fromCharCode(10) + JSON.stringify({ now: readKnobs(), presets }, null, 1);
  const done = ok => { $('bCopy').textContent = ok ? 'Copied! Paste it in the chat' : 'Copy blocked: open full screen and try again';
    setTimeout(() => $('bCopy').textContent = 'Copy values for Claude', 2500); };
  (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).then(() => done(true), () => done(false));
};
try { if (innerWidth >= 700 && localStorage.getItem('sketch-knobs-open') !== '0') { $('panel').classList.add('open'); $('bKnobs').classList.add('on'); } } catch (e) {}
addEventListener('resize', layout);
layout();
// fixed-step loop + fps (one-second average)
let last = performance.now(), acc = 0, frames = 0, fpsT = 0;
const STEP = 1 / 120;
function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.1); last = now;
  acc += dt; while (acc >= STEP) { update(STEP); acc -= STEP; }
  draw(); showButtons();
  frames++; fpsT += dt; if (fpsT >= 1) { $('fps').textContent = Math.round(frames / fpsT) + ' fps'; frames = 0; fpsT = 0; }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.sketch = { GOO, readKnobs, setKnobs, S, tank }; // for Playwright checks
</script>
