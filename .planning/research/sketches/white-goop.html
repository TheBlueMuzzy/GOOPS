<title>F63: White goop</title>
<meta name="description" content="How does the white goop (the Veteran, gooped) move in the tank from rank 31? He picks the crack in most danger, goes there and seals it slowly. Try the three move styles (slide along the goop / ooze behind it / wait then hop), how he picks a crack, how long sealing takes, his size, his squint. Tap him: the laser passes through, 'ow'.">

<script>
'use strict';
const $ = id => document.getElementById(id);

// ===== Tweakable values (the sketch's "content/*.json"). Every knob lives here. =====
// Sizes and distances are in cells (1 = one grid square). Times in seconds.
const GOO = {
  // how he moves
  moveStyle: 0,       // 0 = slide along the goop (gravity), 1 = ooze behind the goop (clings to the back wall), 2 = wait, then hop (gravity)
  secPerCell: 0.7,    // seconds he takes to move one cell
  oozeSlow: 2.5,      // ooze: × slower while he's behind goop
  hopWait: 1.2,       // hop: seconds he waits (crouching) before each hop
  hopHeight: 2,       // hop: most cells up one hop can go (across: up to 2)
  // which crack, and sealing
  targetBy: 0,        // 0 = oldest crack, 1 = hardest for you to reach, 2 = closest to him
  unreachable: 0,     // 0 = he waits as close as he can get, 1 = he takes the next crack he can reach
  sealTime: 6,        // seconds sitting on a crack to seal it
  restAfter: 1.5,     // seconds he rests after a seal before the next one (0 = straight on)
  // his body
  size: 1,            // cells wide (1 or 2)
  buried: 0,          // goop landing on him: 0 = it stacks on him, 1 = he wriggles out to the top
  // his face (eyes = Muzzy's F62 picks, bigger here so the squint reads on a 1-cell clump)
  squint: 0.5,        // how far the lid comes down over his squinting eye (0 = no squint)
  eyeSize: 0.16,      // eye radius, in cells (the F62 pick is 0.1)
  owTime: 1.0,        // seconds the "ow" bubble stays after you zap him
  // the tank
  pieceSpeed: 1.3,    // rows per second the piece falls (the game: 780 ms a row = 1.3)
};
// [name, min, max, step] rows, [name, 'choice', [labels]] rows; a one-item row is a group heading.
const STYLE_NAMES = ['Slide along the goop', 'Ooze behind the goop', 'Wait, then hop'];
const TARGET_NAMES = ['Oldest crack', 'Hardest for you', 'Closest to him'];
const UNREACH_NAMES = ['Waits near it', 'Takes the next one'];
const BURIED_NAMES = ['Stacks on him', 'He wriggles out'];
const KNOBS = [['How he moves'], ['moveStyle', 'choice', STYLE_NAMES], ['secPerCell', 0.1, 3, 0.05], ['oozeSlow', 1, 6, 0.25],
  ['hopWait', 0, 4, 0.1], ['hopHeight', 1, 5, 1],
  ['Which crack, and sealing'], ['targetBy', 'choice', TARGET_NAMES], ['unreachable', 'choice', UNREACH_NAMES],
  ['sealTime', 0.5, 20, 0.5], ['restAfter', 0, 8, 0.25],
  ['His body'], ['size', 1, 2, 1], ['buried', 'choice', BURIED_NAMES],
  ['His face'], ['squint', 0, 0.9, 0.05], ['eyeSize', 0.05, 0.3, 0.01], ['owTime', 0.3, 3, 0.1],
  ['The tank'], ['pieceSpeed', 0, 6, 0.1]];
// plain-word names shown beside each knob (the JSON keeps the short names)
const KNOB_LABEL = { moveStyle: 'Move style', secPerCell: 'Sec per cell', oozeSlow: 'Ooze slow', hopWait: 'Hop wait', hopHeight: 'Hop height',
  targetBy: 'Picks crack', unreachable: "Can't reach", sealTime: 'Seal time', restAfter: 'Rest after',
  size: 'Size', buried: 'Goop on him', squint: 'Squint', eyeSize: 'Eye size', owTime: '"Ow" time', pieceSpeed: 'Piece speed' };
// One line per knob: what it does IN THIS SKETCH, and when you'd notice it. A knob Muzzy can't see working gets fixed or cut.
const KNOB_HELP = {
  moveStyle: 'Slide: falls like goop and inches along the top of it, climbing 1-cell steps. Ooze: clings to the back wall and oozes behind the goop (dotted outline). Hop: falls like goop, crouches, then hops. Also the Move buttons under the tank.',
  secPerCell: 'How long one cell of movement takes. 0.3 = busy little helper; 1.5 = an old man taking his time.',
  oozeSlow: 'Ooze only: how much slower he goes while he\'s behind goop. 1 = goop doesn\'t slow him at all.',
  hopWait: 'Hop only: how long he crouches before each hop. Watch him squash down first.',
  hopHeight: 'Hop only: how many cells up one hop reaches. 1 = he needs stairs; 4 = he gets almost anywhere on top of the goop.',
  targetBy: 'Which crack is "in most danger" (the dotted ring). The game drains the tank the same for every open crack, so this is our call: the oldest (has drained most), the one you\'d have to build up to (or dig to), or the nearest.',
  unreachable: 'Slide / Hop: a crack in mid-air or under goop is out of his reach. Waits near it = he parks under it and looks up (you build to him). Takes the next one = he goes for a crack he can reach.',
  sealTime: 'How long he sits on a crack to seal it. Short = he\'s a big help; long = a little help.',
  restAfter: 'How long he sits still after a seal before heading off again. 0 = straight on to the next.',
  size: '1 = one cell, fits anywhere. 2 = two cells wide: easier to see, but can\'t get into 1-wide pits.',
  buried: 'Slide / Hop: when a piece lands on him. Stacks = he holds it up (and can be buried). Wriggles out = he swaps upward through it, one cell at a time, back to the top.',
  squint: 'How far the lid comes down over his right eye (your right). 0 = no squint; 0.7 = a proper old-sailor squint.',
  eyeSize: 'Eye size in cells. The goop\'s approved eyes are 0.1; on a 1-cell clump the squint only reads from ~0.14 up.',
  owTime: 'How long the "ow" bubble stays after you tap him. He flinches and squeezes his eyes; he never pops.',
  pieceSpeed: 'How fast the falling piece drops (rows per second). 0 = no more pieces fall, so you can watch him on a still tank.',
};

// ===== The sketch itself =====
// Fixed look: the game's L4 Jelly values (content/tuning/goo-jelly.json, Muzzy's pick 2026-10-17). Not knobs here.
const JELLY = { stiffness: 700, viscosity: 6.5, wobble: 0.25, translucency: 0.5, wetness: 0.9, home: 0.3, corner: 0.32, magnetism: 1.4, maxDpr: 1.5 };
// Fixed zap: Muzzy's F67 pick (research/zap-look/picks.json, 2026-10-24). Not knobs here.
const ZAP = { beamTime: 0.3, whiteHot: 0.52, swell: 0.14, suckTime: 0.27, droplets: 15, dropSpeed: 95, dropLife: 1.4, gravity: 310, sprayAt: 0.6 };
// game goo-colors; 6 = the white goop (him) — white is also the 6th normal colour from rank 30, but this sketch keeps it his alone so he's easy to watch
const COLORS = [[0, 0, 0], [0.94, 0.27, 0.27], [0.23, 0.51, 0.96], [0.13, 0.77, 0.37], [0.92, 0.70, 0.03], [0.66, 0.33, 0.97], [0.9, 0.92, 0.95]];
const CSS = ['#000', '#ef4444', '#3b82f6', '#22c55e', '#eab308', '#a855f7', '#f8fafc'];
const COLOR_NAME = ['', 'red', 'blue', 'green', 'yellow', 'purple', 'white'];
// The window: 12 columns (what the game shows of its 30-wide round tank) × 18 rows. This window doesn't wrap round.
const W = 12, H = 18, V1_CELL = 30;
const BOARD = ['............', '............', '............', '............', '............', '............',
  '............', '............', '............', '............', '............', '............', '............', '............',
  '.......YY...', 'RR....BYY..G', 'RRB..BBPPGGG', 'RBBY.PPPGGRR'];
// the four cracks it starts with (x, y from the top, colour, age): one in a pit, one in mid-air, one under the wrong colour, one on top of the goop
const START_CRACKS = [[2, 10, 3, 20], [4, 17, 1, 12], [10, 17, 2, 8], [9, 15, 4, 3]];
// the game's normal tetra pieces (shift.json pieces.tetra.normal)
const SHAPES = [[[0, -1], [0, 0], [0, 1], [0, 2]], [[0, 0], [0, 1], [0, 2], [1, 0]], [[0, 0], [0, 1], [0, 2], [1, 1]], [[0, 0], [0, 1], [1, 1], [1, 2]], [[0, 0], [0, 1], [1, 0], [1, 1]]];
let seed = 7; const rand = () => { seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t ^= t + Math.imul(t ^ (t >>> 7), 61 | t); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
const hash = s => { let h = 2166136261; for (let i = 0; i < s.length; i++) h = Math.imul(h ^ s.charCodeAt(i), 16777619); h ^= h >>> 13; h = Math.imul(h, 0x5bd1e995); return ((h ^ (h >>> 15)) >>> 0) / 4294967296; };

// ---- rules: a plain grid with the game's sticky gravity (a same-colour group falls as one when nothing holds it up)
const G = { grid: new Uint8Array(W * H), ver: 0, events: [], fell: new Set(), lockedPiece: null };
const idx = (x, y) => y * W + x;
let pressure = 0.5, cracks = [], sealedSpots = [], crackId = 1, crackClock = 0, sealedByHim = 0, sealedByYou = 0;
let needSettle = false, settleT = 0, piecesOn = true;
function groupAt(x, y) {
  const c = G.grid[idx(x, y)], out = [], seen = new Set([idx(x, y)]), stack = [[x, y]];
  while (stack.length) {
    const [cx, cy] = stack.pop(); out.push([cx, cy]);
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const nx = cx + dx, ny = cy + dy, i = idx(nx, ny);
      if (nx >= 0 && nx < W && ny >= 0 && ny < H && !seen.has(i) && G.grid[i] === c) { seen.add(i); stack.push([nx, ny]); }
    }
  }
  return out;
}
const gravityStyle = () => GOO.moveStyle !== 1 || !vet.landed; // ooze clings to the wall once he has landed
const isVet = (x, y) => y === vet.y && x >= vet.x && x < vet.x + vet.size;
const vetSolid = (x, y) => gravityStyle() && isVet(x, y); // with gravity he's solid: goop lands on him
// one pass of the game's settle(): every loose group drops one row. Returns true if anything moved.
function dropPass() {
  const seen = new Uint8Array(W * H), loose = [];
  for (let i = 0; i < W * H; i++) {
    if (!G.grid[i] || seen[i]) continue;
    const x = i % W, g = groupAt(x, (i - x) / W), own = new Set(g.map(([gx, gy]) => idx(gx, gy)));
    for (const k of own) seen[k] = 1;
    const held = g.some(([gx, gy]) => gy === H - 1 || (G.grid[idx(gx, gy + 1)] && !own.has(idx(gx, gy + 1))) || vetSolid(gx, gy + 1) || pieceHas(gx, gy + 1));
    if (!held) loose.push({ g, c: G.grid[i] });
  }
  for (const { g } of loose) for (const [x, y] of g) G.grid[idx(x, y)] = 0;
  for (const { g, c } of loose) for (const [x, y] of g) { G.grid[idx(x, y + 1)] = c; G.fell.add(idx(x, y + 1)); }
  if (loose.length) G.ver++;
  return loose.length > 0;
}
function sealCrack(c, by) {
  cracks = cracks.filter(k => k !== c); sealedSpots.push({ id: c.id, x: c.x, y: c.y });
  if (by === 'him') sealedByHim++; else sealedByYou++;
}
function zap(x, y, px, py) { // (x, y) cell; (px, py) the tap point in cell units = where the laser lands
  const c = G.grid[idx(x, y)]; if (!c) return false;
  const cells = groupAt(x, y);
  for (const [cx, cy] of cells) G.grid[idx(cx, cy)] = 0;
  // the game's seal: a crack plugged by goop of its own colour is sealed when that goop pops
  for (const k of cracks.slice()) if (k.color === c && cells.some(([cx, cy]) => cx === k.x && cy === k.y)) sealCrack(k, 'you');
  G.ver++; G.events.push({ type: 'zap', cells, color: c, x: px ?? x + 0.5, y: py ?? y + 0.5 }); needSettle = true; return true;
}
// keep the tank from filling up while you watch: when the goop gets near the top, the biggest clump is zapped for you
function autoZap() {
  let best = null, seen = new Uint8Array(W * H);
  for (let i = 0; i < W * H; i++) { if (!G.grid[i] || seen[i]) continue; const x = i % W, g = groupAt(x, (i - x) / W);
    for (const [gx, gy] of g) seen[idx(gx, gy)] = 1; if (!best || g.length > best.length) best = g; }
  if (best) { const [x, y] = best[Math.floor(best.length / 2)]; zap(x, y, x + 0.5, y + 0.5); }
}
function goopTopY() { for (let i = 0; i < W * H; i++) if (G.grid[i]) return Math.floor(i / W); return H; }
function colTopRow(x) { for (let y = 0; y < H; y++) if (G.grid[idx(x, y)]) return H - 1 - y; return -1; } // as a row from the floor; empty = -1

// ---- cracks: the game's rules (src/engine/cracks.ts), sized to this window
// The pressure line (popLine): 0% = the floor row, 100% = the top row. Cracks only form at or below it.
const lineY = () => Math.round((H - 1) - pressure * (H - 1));
// crackEveryMs with curve 3 (shift.json: 6 s at 0%, 1.33 s at 100%), × 30/12 because this window is 12 of the tank's 30 columns
function crackEvery() { const rate = 1 / 6 + (1 / 1.333 - 1 / 6) * pressure ** 3; return (1 / rate) * (30 / W); }
// The hill (pickHillSpot): each column's base is the first empty row above its goop, borrowing height from up to 4 neighbours;
// the most likely row is halfway from the base to the line (reach 0.5), thinning out like a bell (spread 0.3).
function spawnCrack() {
  if (cracks.length >= 8) return;
  const ly = lineY(), lineRow = H - 1 - ly, own = [];
  for (let x = 0; x < W; x++) own.push(colTopRow(x) + 1);
  const bases = own.map((_, x) => { let b = own[x]; for (let d = 1; d <= 4; d++) { const fade = 1 - d / 5;
    if (x - d >= 0) b = Math.max(b, Math.floor(own[x - d] * fade)); if (x + d < W) b = Math.max(b, Math.floor(own[x + d] * fade)); } return b; });
  const taken = new Set([...cracks, ...sealedSpots].map(c => idx(c.x, c.y))), spots = [], weights = [];
  for (let y = ly; y < H; y++) for (let x = 0; x < W; x++) {
    const i = idx(x, y); if (G.grid[i] || taken.has(i) || isVet(x, y)) continue;
    const row = H - 1 - y, room = Math.max(0, lineRow - bases[x]), peak = bases[x] + 0.5 * room, wd = Math.max(1, 0.3 * room);
    spots.push(i); weights.push(Math.exp(-0.5 * ((row - peak) / wd) ** 2));
  }
  if (!spots.length) return;
  let r = rand() * weights.reduce((a, b) => a + b, 0), pick = spots[spots.length - 1];
  for (let k = 0; k < spots.length; k++) { r -= weights[k]; if (r < 0) { pick = spots[k]; break; } }
  cracks.push({ id: crackId++, x: pick % W, y: Math.floor(pick / W), color: 1 + Math.floor(rand() * 5), age: 0, seal: 0 });
}
// how hard a crack is for YOU: rows you'd have to build up under it, +4 if wrong-colour goop covers it (you'd have to dig)
function hardness(c) {
  const covered = G.grid[idx(c.x, c.y)] && G.grid[idx(c.x, c.y)] !== c.color;
  return Math.max(0, (H - 1 - c.y) - colTopRow(c.x)) + (covered ? 4 : 0);
}

// ---- the falling piece: the game's tetra shapes, falling at pieceSpeed, drifting to a random column, sticky gravity when it locks
const piece = { cells: null, color: 1, x: 0, y: 0, fy: 0, tx: 0, driftT: 0, wait: 0.6, B: null, hx0: null, hy0: null };
function pieceHas(x, y) { if (!piece.cells) return false; for (const [cx, cy] of piece.cells) if (piece.x + cx === x && piece.y + cy === y) return true; return false; }
function pieceBlocked(px, py) {
  for (const [cx, cy] of piece.cells) { const x = px + cx, y = py + cy;
    if (x < 0 || x >= W || y >= H) return true; if (y >= 0 && (G.grid[idx(x, y)] || vetSolid(x, y))) return true; }
  return false;
}
function spawnPiece() {
  let cells = SHAPES[Math.floor(rand() * SHAPES.length)].map(([r, c]) => [c, r]);
  for (let k = Math.floor(rand() * 4); k > 0; k--) cells = cells.map(([x, y]) => [-y, x]);
  const mx = Math.min(...cells.map(c => c[0])), my = Math.min(...cells.map(c => c[1]));
  cells = cells.map(([x, y]) => [x - mx, y - my]);
  const w = Math.max(...cells.map(c => c[0])) + 1;
  piece.cells = cells; piece.color = 1 + Math.floor(rand() * 5); piece.x = Math.floor(rand() * (W - w + 1)); piece.tx = Math.floor(rand() * (W - w + 1));
  piece.y = 0; piece.fy = 0; piece.driftT = 0;
  if (pieceBlocked(piece.x, piece.y)) { piece.cells = null; piece.wait = 0.6; autoZap(); return; }
  const B = makeBody(cells, piece.color); piece.B = B; piece.hx0 = Float32Array.from(B.hx); piece.hy0 = Float32Array.from(B.hy);
  placePiece(); for (let i = 0; i < B.n; i++) { B.x[i] = B.hx[i]; B.y[i] = B.hy[i]; }
}

  { name: 'Old slug', values: { ...DEFAULTS, moveStyle: 0, secPerCell: 1.1, targetBy: 0, unreachable: 0, sealTime: 8, restAfter: 2.5, size: 1, buried: 0, squint: 0.6 } },
  { name: 'Ghost in the wall', values: { ...DEFAULTS, moveStyle: 1, secPerCell: 0.45, oozeSlow: 2, targetBy: 1, sealTime: 5, restAfter: 0.5, size: 1, squint: 0.4 } },
  { name: 'Old frog', values: { ...DEFAULTS, moveStyle: 2, secPerCell: 0.6, hopWait: 1.6, hopHeight: 2, targetBy: 2, unreachable: 1, sealTime: 6, restAfter: 1, size: 2, buried: 1, squint: 0.7, eyeSize: 0.2 } }];
let presets = [], activePreset = 'd';
try { presets = JSON.parse(localStorage.getItem(PKEY)) || STARTERS; } catch (e) { presets = STARTERS; }
function savePresets() { try { localStorage.setItem(PKEY, JSON.stringify(presets)); } catch (e) {} }
function drawPresets() {
  $('presets').innerHTML = `<button data-i="d" class="${activePreset === 'd' ? 'on' : ''}">Default</button>`
    + presets.map((p, i) => `<span class="pw"><button data-i="${i}" class="${activePreset === i ? 'on' : ''}">${p.name}</button><i data-x="${i}" title="Delete">&times;</i></span>`).join('')
    + (presets.length < 3 ? '<button data-i="+" class="add">+ Preset</button>' : '');
}
$('presets').onclick = e => {
  const x = e.target.dataset.x, i = e.target.dataset.i;
  if (x !== undefined) { presets.splice(+x, 1); activePreset = null; savePresets(); }
  else if (i === 'd') { setKnobs(DEFAULTS); activePreset = 'd'; }
  else if (i === '+') {
    let n = 1; while (presets.some(p => p.name === 'Preset ' + n)) n++;
    presets.push({ name: 'Preset ' + n, values: readKnobs() }); activePreset = presets.length - 1; savePresets();
  }
  else if (i !== undefined) { setKnobs(presets[+i].values); activePreset = +i; }
  drawPresets();
};
drawPresets();
$('bCopy').onclick = () => {
  const names = { moveStyle: STYLE_NAMES[GOO.moveStyle], targetBy: TARGET_NAMES[GOO.targetBy], unreachable: UNREACH_NAMES[GOO.unreachable], buried: BURIED_NAMES[GOO.buried] };
  const text = document.title + String.fromCharCode(10) + JSON.stringify({ pressure, now: readKnobs(), names, presets }, null, 1);
  const done = ok => { $('bCopy').textContent = ok ? 'Copied! Paste it in the chat' : 'Copy blocked: open full screen and try again';
    setTimeout(() => $('bCopy').textContent = 'Copy values for Claude', 2500); };
  (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).then(() => done(true), () => done(false));
};
try { if (innerWidth >= 700 && localStorage.getItem('sketch-knobs-open') !== '0') { $('panel').classList.add('open'); $('bKnobs').classList.add('on'); } } catch (e) {}
addEventListener('resize', layout);
refill(); setPressure(0.5); showStyle(); showStatus();
layout();
// fixed-step loop + fps (one-second average); Slow-mo runs the sim at 0.25×
let last = performance.now(), acc = 0, frames = 0, fpsT = 0;
const STEP = 1 / 120;
function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.1); last = now;
  if (!paused) { acc += dt * (slow ? 0.25 : 1); while (acc >= STEP) { update(STEP); acc -= STEP; } }
  draw(); if ((statusT += dt) > 0.15) { statusT = 0; showStatus(); }
  frames++; fpsT += dt; if (fpsT >= 1) { $('fps').textContent = Math.round(frames / fpsT) + ' fps'; frames = 0; fpsT = 0; }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
// for Playwright checks: pause the clock, step it by hand, place cracks, tap him, read what he's doing
window.sketch = { GOO, readKnobs, setKnobs, zap, refill, setPressure, G, groupAt,
  pause: on => { paused = on; acc = 0; },
  advance: sec => { for (let n = Math.round(sec / STEP); n > 0; n--) update(STEP); draw(); showStatus(); },
  pieces: on => { piecesOn = on; if (!on) { piece.cells = null; piece.B = null; } },
  clearCracks: () => { cracks = []; },
  addCrack: (x, y, color = 1, age = 0) => { const c = { id: crackId++, x, y, color, age, seal: 0 }; cracks.push(c); return c.id; },
  tapVet: () => tapVet(vet.px + vet.size / 2, vet.py + 0.5),
  state: () => ({ simT, cell, ox, oy, pressure, lineY: lineY(),
    vet: { x: vet.x, y: vet.y, px: +vet.px.toFixed(2), py: +vet.py.toFixed(2), size: vet.size, state: vet.state, kind: vet.kind, landed: vet.landed,
      waiting: vet.waiting, target: vet.target && { x: vet.target.x, y: vet.target.y, seal: +vet.target.seal.toFixed(2) }, owT: vet.owT, inGoop: +vet.inGoop.toFixed(2), sq: +vet.sq.toFixed(2) },
    cracks: cracks.map(c => ({ id: c.id, x: c.x, y: c.y, color: c.color, age: +c.age.toFixed(1), seal: +c.seal.toFixed(2) })),
    sealedByHim, sealedByYou, status: $('status').textContent }),
  fxPixel: (x, y) => { const fd = devicePixelRatio || 1; return [...fx.getImageData(Math.round(x * fd), Math.round(y * fd), 1, 1).data]; } };
</script>
