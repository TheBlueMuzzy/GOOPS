<title>F62: Goop eyes</title>
<meta name="description" content="How should the goop's eyes and mouths look and move as the story goes on? Pick a rank (10 / 20 / 30 / 40): tiny eyes in big clumps, eyes that follow the falling piece and your laser, blinks, worry at high pressure, relief when a crack is sealed, silent mouths. Tap a goop to zap it and watch the eyes close.">
<style>

<script>
'use strict';
const $ = id => document.getElementById(id);

// ===== Tweakable values (the sketch's "content/*.json"). Every knob lives here. =====
// Sizes and distances are in cells (1 = one grid square). Times in seconds.
const GOO = {
  // the eyes
  eyeSize: 0.13,      // eye radius, in cells (tiny = 0.1)
  pupilSize: 0.5,     // pupil as a share of the eye (1 = all pupil)
  eyeGap: 0.3,        // distance between eye centres, in cells
  eyeCount: 2,        // eyes per clump that has eyes
  eyeColor: '#f8fafc',
  pupilColor: '#0f172a',
  // which clumps get eyes

  minClump20: 2,      // rank 20+: same, once eyes are "in most clumps"
  eyeChance20: 0.85,
  // following (rank 20+)
  followSpeed: 6,     // how fast the pupils catch up (per second)
  followRange: 6,     // cells: further than this, they stop following and look ahead
  // blinks and moods (rank 30+)
  blinkEvery: 3.5,    // s between blinks (each clump varies 50-150%)
  blinkTime: 0.15,    // s one blink takes
  worriedAt: 0.6,     // pressure (0-1) where they start to look worried
  browTilt: 25,       // degrees the worried brows tilt (inner ends up)
  pupilShrink: 0.4,   // how much the pupils shrink when worried (0.4 = 40% smaller)
  reliefTime: 1.2,    // s the eyes close in relief after a crack is sealed
  // zap (all ranks)
  zapClose: 0.6,      // s the eyes stay squeezed shut on the clumps touching a zap
  // mouths (rank 40+)
  mouthChance: 0.5,   // chance a clump with eyes also has a mouth
  mouthSize: 0.3,     // mouth width, in cells
  mouthWobble: 0.5,   // how far the silent mouth opens and closes (0 = a still line)
  // the falling piece
  pieceSpeed: 1.2,    // cells per second it falls
};
// [name, min, max, step] rows (or [name, 'color']); a one-item row is a group heading.
const KNOBS = [['The eyes'], ['eyeSize', 0.04, 0.4, 0.01], ['pupilSize', 0.1, 1, 0.05], ['eyeGap', 0, 0.8, 0.02], ['eyeCount', 1, 4, 1],
  ['eyeColor', 'color'], ['pupilColor', 'color'],
  ['Which clumps get eyes'], ['minClump10', 1, 9, 1], ['eyeChance10', 0, 1, 0.05], ['minClump20', 1, 9, 1], ['eyeChance20', 0, 1, 0.05],
  ['Following (rank 20+)'], ['followSpeed', 0, 20, 0.5], ['followRange', 0, 14, 0.5],
  ['Blinks and moods (rank 30+)'], ['blinkEvery', 0.5, 10, 0.1], ['blinkTime', 0.03, 0.6, 0.01], ['worriedAt', 0, 1, 0.05],
  ['browTilt', 0, 45, 1], ['pupilShrink', 0, 0.9, 0.05], ['reliefTime', 0.1, 4, 0.1],
  ['Zap'], ['zapClose', 0, 3, 0.05],
  ['Mouths (rank 40+)'], ['mouthChance', 0, 1, 0.05], ['mouthSize', 0.05, 0.8, 0.01], ['mouthWobble', 0, 1, 0.05],
  ['The falling piece'], ['pieceSpeed', 0, 6, 0.1]];
// plain-word names shown beside each knob (the JSON keeps the short names)
const KNOB_LABEL = { eyeSize: 'Eye size', pupilSize: 'Pupil size', eyeGap: 'Eye spacing', eyeCount: 'Eyes per clump', eyeColor: 'Eye colour', pupilColor: 'Pupil colour',
  minClump10: 'Min clump (10)', eyeChance10: 'Eye chance (10)', minClump20: 'Min clump (20+)', eyeChance20: 'Eye chance (20+)',
  followSpeed: 'Follow speed', followRange: 'Follow range', blinkEvery: 'Blink every', blinkTime: 'Blink length', worriedAt: 'Worried at',
  browTilt: 'Brow tilt', pupilShrink: 'Pupil shrink', reliefTime: 'Relief close', zapClose: 'Zap close',
  mouthChance: 'Mouth chance', mouthSize: 'Mouth size', mouthWobble: 'Mouth wobble', pieceSpeed: 'Piece speed' };
// One line per knob: what it does IN THIS SKETCH, and when you'd notice it. A knob Muzzy can't see working gets fixed or cut.
const KNOB_HELP = {
  eyeSize: 'How big each eye is (cells). 0.1 = a speck you have to look for; 0.25 = cartoon eyes.',
  pupilSize: 'How much of the eye the pupil fills. Small = staring and creepy; big = cute.',
  eyeGap: 'How far apart the eyes sit. 0 = they overlap into one blob.',
  eyeCount: 'How many eyes a clump with eyes gets, in a row. 3+ starts to feel alien.',
  eyeColor: 'The whites of the eyes.',
  pupilColor: 'The pupils (and the brows and closed-eye lines).',
  minClump10: 'Rank 10: only clumps at least this many cells big can open eyes. The board has clumps of 1, 2, 4, 5, 8 and 9.',
  eyeChance10: 'Rank 10: chance each big-enough clump has eyes. Low = "a few", you have to spot them.',
  minClump20: 'Rank 20+: the smallest clump with eyes once they are "in most clumps".',
  eyeChance20: 'Rank 20+: chance each big-enough clump has eyes.',
  followSpeed: 'Rank 20+: how quickly the pupils swing to the falling piece (or your finger / laser). Low = lazy, high = snappy.',
  followRange: 'Rank 20+: only clumps this close (cells) to the piece follow it; the rest look ahead. Watch the far corner.',
  blinkEvery: 'Rank 30+: seconds between blinks. Each clump blinks on its own clock.',
  blinkTime: 'Rank 30+: how long one blink takes. Long = sleepy.',
  worriedAt: 'Rank 30+: when the Pressure slider passes this, the eyes look worried (brows, small shaky pupils).',
  browTilt: 'Rank 30+: how steep the worried brows are. 0 = no brows.',
  pupilShrink: 'Rank 30+: how much the pupils shrink when worried. Turn Pressure to 100% to see the most.',
  reliefTime: 'Rank 30+: seconds the eyes close in relief (soft curves) after you press Seal a crack.',
  zapClose: 'Seconds the clumps touching a zapped goop squeeze their eyes shut. The zapped one shuts at once.',
  mouthChance: 'Rank 40: chance a clump with eyes also has a mouth.',
  mouthSize: 'Rank 40: how wide the mouths are (cells).',
  mouthWobble: 'Rank 40: how far the silent mouths open and close. 0 = a still line.',
  pieceSpeed: 'How fast the piece falls (cells/s); it drifts side to side so you can watch the eyes follow. 0 = it hangs still.',
};

// ===== The sketch itself =====
// Fixed look: the game's L4 Jelly values (content/tuning/goo-jelly.json, Muzzy's pick 2026-10-17). Not knobs here.
const JELLY = { stiffness: 700, viscosity: 6.5, wobble: 0.25, translucency: 0.5, wetness: 0.9, home: 0.3, corner: 0.32, magnetism: 1.4, maxDpr: 1.5 };
// Fixed zap: Muzzy's F67 pick (research/zap-look/picks.json, 2026-10-24). Not knobs here.
const ZAP = { beamTime: 0.3, whiteHot: 0.52, swell: 0.14, suckTime: 0.27, droplets: 15, dropSpeed: 95, dropLife: 1.4, gravity: 310, sprayAt: 0.6 };
const COLORS = [[0, 0, 0], [0.94, 0.27, 0.27], [0.23, 0.51, 0.96], [0.13, 0.77, 0.37], [0.92, 0.70, 0.03], [0.66, 0.33, 0.97]]; // game goo-colors
const CSS = ['#000', '#ef4444', '#3b82f6', '#22c55e', '#eab308', '#a855f7'];
const W = 8, H = 12, V1_CELL = 30;
// the board: clumps of 1, 2, 4, 5, 8 and 9 cells (R red, B blue, G green, Y yellow, P purple). The top half is for the falling piece.
const BOARD = ['........', '........', '........', '........', '........', '........',
  '..BB..GP', '..BBRGGP', 'RRRYYGGP', 'RRRYPPPP', 'RRBYPGGB', 'BBBYPGGB'];
let seed = 7; const rand = () => { seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t ^= t + Math.imul(t ^ (t >>> 7), 61 | t); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
// a fixed 0..1 number per text, so a clump keeps the same dice roll for "has eyes?" across rebuilds and rank changes
const hash = s => { let h = 2166136261; for (let i = 0; i < s.length; i++) h = Math.imul(h ^ s.charCodeAt(i), 16777619); h ^= h >>> 13; h = Math.imul(h, 0x5bd1e995); return ((h ^ (h >>> 15)) >>> 0) / 4294967296; };

// ---- rules: a plain grid. Tap a group -> it's zapped (any size). Never reads the visuals.
const G = { grid: new Uint8Array(W * H), ver: 0, events: [] };
const idx = (x, y) => y * W + x;
function refill() { for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) G.grid[idx(x, y)] = ' RBGYP'.indexOf(BOARD[y][x]) > 0 ? ' RBGYP'.indexOf(BOARD[y][x]) : 0; G.ver++; }
function groupAt(x, y) {
  const c = G.grid[idx(x, y)], out = [], seen = new Set([idx(x, y)]), stack = [[x, y]];
  while (stack.length) {
    const [cx, cy] = stack.pop(); out.push([cx, cy]);
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const nx = cx + dx, ny = cy + dy, i = idx(nx, ny);
      if (nx >= 0 && nx < W && ny >= 0 && ny < H && !seen.has(i) && G.grid[i] === c) { seen.add(i); stack.push([nx, ny]); }
    }
  }
  return out;
}
function zap(x, y, px, py) { // (x, y) cell; (px, py) the tap point in cell units = where the laser lands
  const c = G.grid[idx(x, y)]; if (!c) return false;
  const cells = groupAt(x, y);
  for (const [cx, cy] of cells) G.grid[idx(cx, cy)] = 0;
  G.ver++; G.events.push({ type: 'zap', cells, color: c, x: px ?? x + 0.5, y: py ?? y + 0.5 }); return true;
}

// ---- story state: rank, pressure, relief
let rank = 20, pressure = 0, reliefT = -1, sealT = -1, aim = null;

// ---- jelly layer (ported from lab-L4-jelly.html via zap-look.html): one shape-matched soft body per group
let bodies = [], zapped = [], drops = [], kicks = [], nextId = 1, seenVer = -1, beam = null, simT = 0;
let cellBody = new Int32Array(W * H).fill(-1);
function traceLoops(cells) {
  const key = (x, y) => (x + 64) * 1024 + (y + 64);
  const has = new Set(cells.map(([x, y]) => key(x, y)));
  const edges = new Map(), all = [];
  const add = (x0, y0, dx, dy, cell) => { const e = { x0, y0, dx, dy, cell, used: false }, k = key(x0, y0);
    if (!edges.has(k)) edges.set(k, []); edges.get(k).push(e); all.push(e); };
  cells.forEach(([x, y], ci) => {
    if (!has.has(key(x, y - 1))) add(x, y, 1, 0, ci);
    if (!has.has(key(x + 1, y))) add(x + 1, y, 0, 1, ci);
    if (!has.has(key(x, y + 1))) add(x + 1, y + 1, -1, 0, ci);
    if (!has.has(key(x - 1, y))) add(x, y + 1, 0, -1, ci);
  });
  const loops = [];
  for (const e0 of all) {
    if (e0.used) continue;
    const loop = []; let cur = e0;
    while (cur && !cur.used) {
      cur.used = true; loop.push(cur);
      const list = edges.get(key(cur.x0 + cur.dx, cur.y0 + cur.dy)) || [];
      let best = null, bs = -9;
      for (const c of list) { if (c.used) continue; const s = cur.dx * c.dy - cur.dy * c.dx; if (s > bs) { bs = s; best = c; } }
      cur = best;
    }
    loops.push(loop);
  }
  return loops;
}
function buildPoints(loops, B) {
  for (const loop of loops) {
    const n = loop.length, start = B.n, corners = [];
    for (let k = 0; k < n; k++) { const a = loop[(k + n - 1) % n], b = loop[k]; if (a.dx !== b.dx || a.dy !== b.dy) corners.push(k); }
    const rad = k => { const a = loop[(k + n - 1) % n], b = loop[k]; return (a.dx * b.dy - a.dy * b.dx) > 0 ? JELLY.corner : JELLY.corner * 0.5; };
    for (let j = 0; j < corners.length; j++) {
      const k = corners[j], kn = corners[(j + 1) % corners.length];
      const ein = loop[(k + n - 1) % n], eo = loop[k], Vx = eo.x0, Vy = eo.y0, r = rad(k);
      for (const t of [0, 0.25, 0.5, 0.75]) {
        const ax = Vx - ein.dx * r, ay = Vy - ein.dy * r, bx = Vx + eo.dx * r, by = Vy + eo.dy * r, u = 1 - t;
        pushPt(B, u * u * ax + 2 * t * u * Vx + t * t * bx, u * u * ay + 2 * t * u * Vy + t * t * by);
      }
      const runLen = ((kn - k + n) % n) || n, r2 = rad(kn), L = runLen - r - r2, m = Math.max(1, Math.round(L / 0.3));
      for (let i = 0; i < m; i++) { const s = i * L / m; pushPt(B, Vx + eo.dx * (r + s), Vy + eo.dy * (r + s)); }
    }
    B.loops.push([start, B.n - start]);
  }
}
function pushPt(B, x, y) { B.bx.push(x); B.by.push(y); B.n++; }
function makeBody(cells, color) {
  const B = { id: nextId++, color, cells, n: 0, loops: [], bx: [], by: [], fa: 0, fcx: 0, fcy: 0, rcx: 0, rcy: 0, alpha: 1, hot: 0, sc: 1 };
  buildPoints(traceLoops(cells), B);
  B.hx = Float32Array.from(B.bx); B.hy = Float32Array.from(B.by); B.x = new Float32Array(B.n); B.y = new Float32Array(B.n);
  B.vx = new Float32Array(B.n); B.vy = new Float32Array(B.n);
  let tl = 0; cells.forEach(([x, y], i) => { if (y < cells[tl][1] || (y === cells[tl][1] && x < cells[tl][0])) tl = i; });
  const [tx, ty] = cells[tl]; let run = 1; while (run < 3 && cells.some(([x, y]) => x === tx + run && y === ty)) run++;
  const tall = cells.some(([x, y]) => x === tx && y === ty + 1);
  B.hlX = tx + 0.42 + 0.36 * (run - 1); B.hlY = ty + 0.3; B.hlW = 0.24 + 0.2 * (run - 1); B.hlH = tall ? 0.12 : 0.1;
  B.cellIdx = cells.map(([x, y]) => idx(x, y));
  return B;
}
function transfer(B, olds) { // carry the old wobble across a rebuild; brand-new bodies spring out from 70%
  let matched = 0;
  for (let i = 0; i < B.n; i++) {
    let best = null, bi = 0, bd = 0.5;
    for (const O of olds) { if (O.color !== B.color) continue;
      for (let k = 0; k < O.n; k++) { const d = Math.abs(O.hx[k] - B.hx[i]) + Math.abs(O.hy[k] - B.hy[i]); if (d < bd) { bd = d; best = O; bi = k; } } }
    if (best) { B.x[i] = B.hx[i] + best.x[bi] - best.hx[bi]; B.y[i] = B.hy[i] + best.y[bi] - best.hy[bi]; B.vx[i] = best.vx[bi]; B.vy[i] = best.vy[bi]; matched++; }
    else { B.x[i] = B.hx[i]; B.y[i] = B.hy[i]; }
  }
  if (!matched) {
    let cx = 0, cy = 0; for (let i = 0; i < B.n; i++) { cx += B.hx[i]; cy += B.hy[i]; } cx /= B.n; cy /= B.n;
    for (let i = 0; i < B.n; i++) { B.x[i] = cx + (B.hx[i] - cx) * 0.7; B.y[i] = cy + (B.hy[i] - cy) * 0.7; }
  }
}
function kick(B, kind, amt) {
  if (!B || !amt) return;
  let cx = 0, cy = 0, ymax = -1e9, ymin = 1e9; for (let i = 0; i < B.n; i++) { cx += B.x[i]; cy += B.y[i]; ymax = Math.max(ymax, B.y[i]); ymin = Math.min(ymin, B.y[i]); } cx /= B.n; cy /= B.n;
  const hgt = Math.max(1, ymax - ymin), s = amt * JELLY.wobble;
  for (let i = 0; i < B.n; i++) {
    const dx = B.x[i] - cx, dy = B.y[i] - cy;
    if (kind === 'squash') { B.vy[i] += s * (ymax - B.y[i]) / Math.sqrt(hgt); B.vx[i] += s * 0.6 * dx / Math.sqrt(hgt); }
    else if (kind === 'radial') { B.vx[i] += s * dx; B.vy[i] += s * dy; }
  }
}
function rebuild() {
  const olds = bodies, next = [], seen = new Uint8Array(W * H);
  cellBody = new Int32Array(W * H).fill(-1);
  for (let i = 0; i < W * H; i++) {
    if (!G.grid[i] || seen[i]) continue;
    const x = i % W, y = (i - x) / W, g = groupAt(x, y); for (const [gx, gy] of g) seen[idx(gx, gy)] = 1;
    const B = makeBody(g, G.grid[i]); transfer(B, olds);
    B.face = faceFor(B);
    for (const ci of B.cellIdx) cellBody[ci] = B.id;
    next.push(B);
  }
  bodies = next;
}

  { name: 'Creepy', values: { ...DEFAULTS, eyeSize: 0.12, pupilSize: 0.28, eyeGap: 0.26, eyeCount: 3, eyeColor: '#fde68a', pupilColor: '#1c0505',
    followSpeed: 14, followRange: 14, blinkEvery: 8, blinkTime: 0.3, mouthChance: 0.8, mouthSize: 0.36, mouthWobble: 0.25 } }];
let presets = [], activePreset = 'd';
try { presets = JSON.parse(localStorage.getItem(PKEY)) || STARTERS; } catch (e) { presets = STARTERS; }
function savePresets() { try { localStorage.setItem(PKEY, JSON.stringify(presets)); } catch (e) {} }
function drawPresets() {
  $('presets').innerHTML = `<button data-i="d" class="${activePreset === 'd' ? 'on' : ''}">Default</button>`
    + presets.map((p, i) => `<span class="pw"><button data-i="${i}" class="${activePreset === i ? 'on' : ''}">${p.name}</button><i data-x="${i}" title="Delete">&times;</i></span>`).join('')
    + (presets.length < 3 ? '<button data-i="+" class="add">+ Preset</button>' : '');
}
$('presets').onclick = e => {
  const x = e.target.dataset.x, i = e.target.dataset.i;
  if (x !== undefined) { presets.splice(+x, 1); activePreset = null; savePresets(); }
  else if (i === 'd') { setKnobs(DEFAULTS); activePreset = 'd'; }
  else if (i === '+') {
    let n = 1; while (presets.some(p => p.name === 'Preset ' + n)) n++;
    presets.push({ name: 'Preset ' + n, values: readKnobs() }); activePreset = presets.length - 1; savePresets();
  }
  else if (i !== undefined) { setKnobs(presets[+i].values); activePreset = +i; }
  drawPresets();
};
drawPresets();
$('bCopy').onclick = () => {
  const text = document.title + String.fromCharCode(10) + JSON.stringify({ rank, pressure, now: readKnobs(), presets }, null, 1);
  const done = ok => { $('bCopy').textContent = ok ? 'Copied! Paste it in the chat' : 'Copy blocked: open full screen and try again';
    setTimeout(() => $('bCopy').textContent = 'Copy values for Claude', 2500); };
  (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).then(() => done(true), () => done(false));
};
try { if (innerWidth >= 700 && localStorage.getItem('sketch-knobs-open') !== '0') { $('panel').classList.add('open'); $('bKnobs').classList.add('on'); } } catch (e) {}
addEventListener('resize', layout);
layout();
// fixed-step loop + fps (one-second average); Slow-mo runs the sim at 0.25×
let last = performance.now(), acc = 0, frames = 0, fpsT = 0;
const STEP = 1 / 120;
function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.1); last = now;
  if (!paused) { acc += dt * (slow ? 0.25 : 1); while (acc >= STEP) { update(STEP); acc -= STEP; } }
  draw();
  frames++; fpsT += dt; if (fpsT >= 1) { $('fps').textContent = Math.round(frames / fpsT) + ' fps'; frames = 0; fpsT = 0; }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
// for Playwright checks: pause the clock, step it by hand, switch rank / pressure, read what the faces are doing
window.sketch = { GOO, readKnobs, setKnobs, zap, refill, seal, setRank, setPressure, G, groupAt,
  pause: on => { paused = on; acc = 0; },
  advance: sec => { for (let n = Math.round(sec / STEP); n > 0; n--) update(STEP); draw(); },
  aimAt: (x, y) => { aim = { x, y, t: simT }; },
  state: () => ({ rank, pressure, reliefT, simT, cell, ox, oy, beam, piece: pieceCentre(), worried: worriedAmount(), relief: reliefAmount(),
    clumps: bodies.map(B => ({ size: B.cells.length, color: B.color, eyes: hasEyes(B), mouth: hasMouth(B), spot: B.face.spot,
      gaze: [+B.face.gx.toFixed(3), +B.face.gy.toFixed(3)], blinkT: B.face.blinkT, zapT: B.face.zapT })) }),
  pixel: (x, y) => { const p = new Uint8Array(4); gl.readPixels(Math.round(x * dpr), Math.round(canvas.height - y * dpr), 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, p); return [...p.slice(0, 3)]; },
  fxPixel: (x, y) => { const fd = devicePixelRatio || 1; return [...fx.getImageData(Math.round(x * fd), Math.round(y * fd), 1, 1).data]; } };
</script>
